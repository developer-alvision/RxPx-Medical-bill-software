<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== Bill reader: turns OCR / PDF / spreadsheet text into bill details ===== */
const BillParser = (() => {
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  const pad = n => String(n).padStart(2, '0');
  const daysIn = (y, m) => new Date(y, m, 0).getDate();
  const mk = (y, m, d) => { if (y < 100) y += 2000; return m >= 1 && m <= 12 && d >= 1 && d <= daysIn(y, m) ? `${y}-${pad(m)}-${pad(d)}` : '' };
  const monthOf = s => { const t = String(s || '').toLowerCase().replace(/0/g, 'o'); return MONTHS[t.slice(0, 4)] || MONTHS[t.slice(0, 3)] || 0 };
  const letters = s => (String(s).match(/[A-Za-z]/g) || []).length;
  const digits = s => (String(s).match(/\d/g) || []).length;
  const round2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const near = (a, b, tol = 0.02) => a > 0 && b > 0 && Math.abs(a - b) <= Math.max(0.6, tol * Math.max(a, b));

  /* ---------- dates ---------- */
  // every date-looking piece of text, in reading order
  function findDates(text, today = new Date()) {
    const out = [], t = String(text || '');
    const push = (i, y, m, d) => { const v = mk(+y, +m, +d); if (v) out.push({ i, v }) };
    let r;
    const re1 = /\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g;
    while ((r = re1.exec(t))) push(r.index, r[1], r[2], r[3]);
    const re2 = /\b(\d{1,2})(?:st|nd|rd|th)?[\s\-\/.,']*([A-Za-z0][A-Za-z0]{2,8})\.?[\s\-\/.,']*(\d{4}|\d{2})\b/g;
    while ((r = re2.exec(t))) { const m = letters(r[2]) >= 2 ? monthOf(r[2]) : 0; if (m) push(r.index, r[3], m, r[1]) }
    const re3 = /\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/g;
    while ((r = re3.exec(t))) { const m = monthOf(r[1]); if (m) push(r.index, r[3], m, r[2]) }
    const re4 = /(?<![\d\/])(\d{1,2})\s?[\/\-.]\s?(\d{1,2})\s?[\/\-.]\s?(\d{4}|\d{2})(?![\d\/])/g;
    while ((r = re4.exec(t))) {
      let a = +r[1], b = +r[2];
      if (a <= 12 && b > 12) [a, b] = [b, a]; // month/day order
      push(r.index, r[3], b, a);
    }
    const max = new Date(today); max.setDate(max.getDate() + 3);
    const lo = `${today.getFullYear() - 6}-01-01`, hi = `${max.getFullYear()}-${pad(max.getMonth() + 1)}-${pad(max.getDate())}`;
    return out.filter(x => x.v >= lo && x.v <= hi).sort((a, b) => a.i - b.i);
  }
  // expiry / manufacturing dates: 06/27, 06/2027, JUN-27, 0627, 30/06/2027 ...
  function parseMonthDate(text, end) {
    let t = String(text || '').trim().toUpperCase().replace(/[|\[\]{}]/g, '');
    if (!t) return '';
    const fin = (y, m, d) => { y = +y; if (y < 100) y += 2000; m = +m; if (y < 2000 || y > 2049 || m < 1 || m > 12) return ''; return mk(y, m, d || (end ? daysIn(y, m) : 1)) };
    let r = t.match(/(\d{1,2})\s?[\/\-.]\s?(\d{1,2})\s?[\/\-.]\s?(\d{4}|\d{2})/);
    if (r) { const v = mk(+r[3], +r[2], +r[1]); if (v) return v }
    r = t.match(/(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if (r) return mk(+r[1], +r[2], +r[3]);
    r = t.match(/([A-Z]{3,9})\.?[\s\-\/.']*(\d{4}|\d{2})\b/);
    if (r && monthOf(r[1])) return fin(r[2], monthOf(r[1]));
    r = t.match(/(?<!\d)(\d{1,2})\s?[\/\-.:']\s?(\d{4}|\d{2})(?!\d)/);
    if (r) return fin(r[2], r[1]);
    const d = t.replace(/[^0-9]/g, '');
    if (/^\d{4}$/.test(t.replace(/\s/g, '')) && +d.slice(0, 2) >= 1 && +d.slice(0, 2) <= 12) return fin(d.slice(2), d.slice(0, 2));
    if (/^\d{5}$/.test(d) && /[17]/.test(d[2]) && +d.slice(0, 2) <= 12) return fin(d.slice(3), d.slice(0, 2)); // "06727" = 06/27 read badly
    if (/^\d{6}$/.test(d) && +d.slice(0, 2) <= 12 && d.slice(2, 4) === '20') return fin(d.slice(2), d.slice(0, 2)); // 062027
    return '';
  }

  /* ---------- numbers ---------- */
  function fixDigits(s) { // common OCR letter/digit mix-ups inside numbers
    return s.replace(/[Oo]/g, '0').replace(/[Il|!]/g, '1').replace(/[Ss](?=\d|$)/g, '5').replace(/[Zz]/g, '2').replace(/B(?=\d)/g, '8');
  }
  function money(tok) {
    let s = String(tok == null ? '' : tok).trim();
    if (!s) return null;
    if (typeof tok === 'number') return Number.isFinite(tok) ? { v: tok, dot: !Number.isInteger(tok) } : null;
    const neg = /^\(.*\)$/.test(s) || /^[-−–]/.test(s);
    s = s.replace(/^(?:rs|inr)\.?/i, '').replace(/[₹$\s]/g, '').replace(/\/-$/, '').replace(/^[(\-−–+]+|[)]+$/g, '').replace(/[,']/g, '');
    if (!s || digits(s) === 0) return null;
    if (letters(s) && digits(s) >= 2 && letters(s) <= 2) s = fixDigits(s);
    s = s.replace(/[.:]+$/, '');
    if (!/^\d*\.?\d+$/.test(s)) return null;
    const v = Number(s);
    return Number.isFinite(v) ? { v: neg ? -v : v, dot: s.includes('.') } : null;
  }
  const num = tok => { const m = money(tok); return m ? m.v : '' };
  const isMoneyTok = t => /^[(\-−]?(?:rs\.?|₹)?\d[\d,]*(?:\.\d{1,2})?\)?(?:\/-)?$/i.test(t);
  const isPct = t => /%$/.test(t) || /^@/.test(t);

  /* ---------- tokens / lines ---------- */
  const NOISE = /^[|\[\]{}=~_—–:;!,.'"`*^<>\\\/]+$/;
  function cleanTok(t) {
    t = String(t).replace(/^[|\[\]{}!]+|[|\[\]{}!]+$/g, '').trim();
    return NOISE.test(t) ? '' : t;
  }
  function prepareDoc(doc) {
    const lines = [];
    for (const l of doc.lines || []) {
      const toks = [];
      for (const k of l.toks || []) {
        const parts = String(k.t).split(/\s+/).filter(Boolean);
        if (parts.length > 1 && doc.source !== 'sheet') { // split multi-word items, spread x evenly by length
          const total = parts.join(' ').length, span = (k.x1 - k.x0) / Math.max(1, total);
          let off = 0;
          for (const p of parts) { const c = cleanTok(p); if (c) toks.push({ ...k, t: c, x0: k.x0 + off * span, x1: k.x0 + (off + p.length) * span }); off += p.length + 1 }
        } else { const c = cleanTok(k.t); if (c) toks.push({ ...k, t: c }) }
      }
      if (!toks.length) continue;
      toks.sort((a, b) => a.x0 - b.x0);

/* ---------- reading bills ---------- */
function withTimeout(promise,ms,message,onTimeout){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>{onTimeout&&onTimeout();reject(new Error(message))},ms)})]).finally(()=>clearTimeout(timer))}
function fileKind(file){const name=file.name.toLowerCase();if(file.type.startsWith('image/')||/\.(jpe?g|png|webp|bmp|gif|heic|heif)$/.test(name))return'image';if(file.type=='application/pdf'||name.endsWith('.pdf'))return'pdf';if(/\.(xlsx|xls|csv)$/.test(name)||/spreadsheet|excel|text\/csv/.test(file.type))return'sheet';return''}
const parseNumber=v=>{const m=BillParser.money(v);return m?m.v:''};
const billAmount=d=>{const t=parseNumber(d.total_amount);if(t!=='')return t;const sub=d.items.reduce((s,i)=>s+(+i.amount||0),0);return r2(sub+(+d.tax_amount||0)-(+d.discount_amount||0))};
function setReadProgress(message,step){S.ocrMessage=message;if(step!==undefined)setStep(step);const status=$('#ocrStatus');if(status)status.textContent=message}
const READ={ready:null,worker:null,log:null};
function ocrReady(){if(!window.Tesseract)return Promise.reject(new Error('The bill reader could not load. Check your internet connection and try again.'));
if(!READ.ready){READ.ready=(async()=>{const w=await Tesseract.createWorker('eng',1,{logger:m=>READ.log&&READ.log(m)});await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1',user_defined_dpi:'300'});READ.worker=w;return w})();READ.ready.catch(()=>{READ.ready=null})}return READ.ready}
const resetReader=()=>{try{READ.worker&&READ.worker.terminate()}catch{}READ.worker=null;READ.ready=null};
const warmReader=()=>{try{ocrReady().catch(()=>{})}catch{}};
async function ocrCanvas(canvas,label){
READ.log=m=>{if(m.status=='recognizing text')setReadProgress(`${label} ${Math.round((m.progress||0)*100)}%`,1);else if(/loading|initializ/.test(m.status||''))setReadProgress('Getting the bill reader ready. The first time can take a minute...',1)};
const w=await withTimeout(ocrReady(),150000,'The bill reader took too long to load. Check your internet connection and try again.',resetReader);
const r=await withTimeout(w.recognize(canvas),150000,'Reading took too long. Try a clearer photo taken closer to the bill.',resetReader);
return{conf:r.data.confidence||0,text:r.data.text||'',lines:(r.data.lines||[]).map(l=>({toks:(l.words||[]).map(wd=>({t:wd.text,x0:wd.bbox.x0,x1:wd.bbox.x1,y0:wd.bbox.y0,y1:wd.bbox.y1,c:wd.confidence}))}))}}
const loadImageEl=file=>new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res({img:i,done:()=>URL.revokeObjectURL(u)});i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('This photo cannot be opened. Choose another photo (JPG or PNG).'))};i.src=u});
async function readImage(file,rot,id){const{img,done}=await loadImageEl(file);try{setReadProgress('Cleaning up the photo...',1);await new Promise(r=>setTimeout(r,30));
let best=null;const side=(rot%2==0)&&BillImage.sideways(img),order=side?[1,3,0]:[0,1,3,2];for(const extra of order){if(S.run!=id)throw new Error('cancelled');const canvas=BillImage.prepare(img,rot+extra);const r=await ocrCanvas(canvas,extra?'Turning the photo and reading again...':'Reading your bill...');const d=BillParser.parse({source:'ocr',lines:r.lines},parseCtx());const score=d.items.length*2+(d.total_amount!==''&&!d.warnings.includes('total_calculated')?4:0)+(d.bill_date?2:0)+(d.bill_number?2:0)+r.conf/10;if(!best||score>best.score)best={score,r,d,rot:rot+extra};const realTotal=d.total_amount!==''&&!d.warnings.includes('total_calculated');if(d.items.length&&realTotal&&(d.bill_date||d.bill_number)||r.conf>=70&&(d.bill_date||d.bill_number||d.items.length))break}
S.file.rot=((best.rot%4)+4)%4;return best}finally{done()}}
function groupLines(toks){toks.sort((a,b)=>a.y0-b.y0||a.x0-b.x0);const lines=[];for(const t of toks){const h=Math.max(1,t.y1-t.y0),cy=(t.y0+t.y1)/2,l=lines.find(l=>Math.abs(l.cy-cy)<=Math.max(h,l.h)*0.5);if(l){l.toks.push(t)}else lines.push({cy,h,toks:[t]})}lines.sort((a,b)=>a.cy-b.cy);return lines.map(l=>({toks:l.toks.sort((a,b)=>a.x0-b.x0)}))}
async function readPdf(file,id){if(!window.pdfjsLib)throw new Error('PDF reading is unavailable. Check your internet connection or upload photos of the pages instead.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const pdf=await withTimeout(pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,30000,'Could not open this PDF in time. Try another copy.');if(pdf.numPages>30)throw new Error('This PDF has more than 30 pages. Split it into smaller files and try again.');
const lines=[];let source='pdf';
for(let p=1;p<=pdf.numPages;p++){if(S.run!=id)throw new Error('cancelled');setReadProgress(`Reading PDF page ${p} of ${pdf.numPages}...`,1);const page=await withTimeout(pdf.getPage(p),20000,'This PDF page could not be opened. Try another copy.'),vp=page.getViewport({scale:1}),content=await withTimeout(page.getTextContent(),20000,'This PDF page could not be read. Try another copy.');
const toks=content.items.filter(it=>it.str&&it.str.trim()).map(it=>{const x=it.transform[4],y=it.transform[5],h=Math.abs(it.height||it.transform[3])||10,w=it.width||it.str.length*h*0.5;return{t:it.str.trim(),x0:x,x1:x+w,y0:vp.height-y-h,y1:vp.height-y}});
if(toks.map(t=>t.t).join('').replace(/\s/g,'').length<25){source='ocr';const scale=Math.min(3.5,2400/vp.width),view=page.getViewport({scale}),c=document.createElement('canvas');c.width=Math.ceil(view.width);c.height=Math.ceil(view.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await withTimeout(page.render({canvasContext:ctx,viewport:view}).promise,30000,'This PDF page could not be shown. Try photos of the pages instead.');
const r=await ocrCanvas(BillImage.prepare(c,0),`Reading page ${p} of ${pdf.numPages}...`);lines.push(...r.lines)}

    .report-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,.75fr); gap:18px; }
    .report-stats { display:grid; gap:10px; padding:16px; }
    .report-stat { display:flex; justify-content:space-between; gap:15px; padding:13px; border-radius:12px; background:var(--soft); }
    .report-stat b { font-weight:800; }
    .setup { width:min(800px,calc(100% - 40px)); margin:40px auto; }
    .codebox { overflow:auto; max-height:310px; margin-top:16px; padding:15px; border-radius:13px; color:#eaeaea; background:#181818; font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre; }
    #toast { position:fixed; z-index:20; right:22px; bottom:22px; max-width:min(390px,calc(100% - 44px)); padding:13px 15px; border-radius:13px; color:#fff; background:#1d1d1d; box-shadow:0 14px 35px rgba(0,0,0,.2); font-weight:700; opacity:0; pointer-events:none; transform:translateY(14px); transition:.22s ease; }
    #toast.show { opacity:1; transform:translateY(0); }
    @media (max-width:900px) {
      .auth-wrap { grid-template-columns:1fr; }
      .auth-hero { min-height:auto; padding:34px 28px; }
      .hero-copy { margin:42px 0 16px; }
      .hero-points { display:none; }
      .auth-panel { padding:45px 25px; }
      .app-layout { grid-template-columns:1fr; }
      .side { padding:10px 16px; overflow:auto; border-right:0; border-bottom:1px solid var(--line); }
      .side-label { display:none; }
      .nav { display:flex; min-width:max-content; }
      .nav button { min-width:max-content; }
      .content { padding:31px 24px 65px; }
      .dashboard-grid,.upload-layout,.detail-layout,.report-grid { grid-template-columns:1fr; }
      .detail-side { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .detail-side > * + * { margin-top:0; }
    }
    @media (max-width:620px) {
      .topbar { height:68px; padding:0 17px; }
      .user-chip { display:none; }
      .page { width:min(100% - 32px,1160px); padding-top:30px; }
      .content { padding:25px 16px 55px; }
      .page-head,.review-top { display:block; }
      .page-head .btn { margin-top:16px; }
      .summary-grid,.choice-grid,.grid2 { grid-template-columns:1fr; }
      .summary { min-height:110px; }
      .choice { min-height:205px; }
      .form-card { padding:17px; }
      .details { grid-template-columns:1fr; }
      .detail-side { grid-template-columns:1fr; }
      .form-actions { justify-content:stretch; }
      .form-actions .btn { flex:1; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
  "use strict";

  /*
   * Paste the public values from your Supabase project's Connect dialog here.
   * The anon/publishable key is safe in a browser only because supabase-setup.sql
   * enables Row Level Security. Never put a service_role key in this file.
   */
  const APP_CONFIG = Object.freeze({
    supabaseUrl: "",
    supabaseAnonKey: "",
    storageBucket: "bill-files"
  });

  const configured = /^https:\/\//.test(APP_CONFIG.supabaseUrl) && APP_CONFIG.supabaseAnonKey.trim().length > 20;
  const db = configured && window.supabase ? window.supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  }) : null;

  if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function freshDraft() {
    return {
      billType:"expense", vendor:"", billNumber:"", billDate:new Date().toISOString().slice(0,10),
      total:"", items:[], confidence:0
    };
  }

  const state = {
    user:null, view:"boot", authMode:"signin", ledgers:[], bills:[], activeLedger:null,
    file:null, rawText:"", parsed:freshDraft(), duplicateBills:[], forceDuplicate:false,
    busy:false, scanStatus:"", scanProgress:0, detailId:null, charts:[], message:""
  };

  const $ = function (selector, root) { return (root || document).querySelector(selector); };
  const $$ = function (selector, root) { return Array.from((root || document).querySelectorAll(selector)); };
  const escapeHtml = function (value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char];
    });
  };
  const escapeAttr = escapeHtml;
  const money = function (value) {
    return new Intl.NumberFormat("en-IN", { style:"currency", currency:"INR", maximumFractionDigits:2 }).format(Number(value || 0));
  };
  const count = function (value, word) { return String(value) + " " + word + (Number(value) === 1 ? "" : "s"); };
  const dateText = function (value, includeTime) {
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return escapeHtml(value);
    return new Intl.DateTimeFormat("en-IN", {
      day:"2-digit", month:"short", year:"numeric",
      hour:includeTime ? "2-digit" : undefined,
      minute:includeTime ? "2-digit" : undefined
    }).format(date);
  };
  const fileSize = function (bytes) {
    if (!bytes) return "0 B";
    const units = ["B","KB","MB","GB"];
    const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    return (bytes / Math.pow(1024,index)).toFixed(index ? 1 : 0) + " " + units[index];
  };
  const ledgerFor = function (id) { return state.ledgers.find(function (ledger) { return ledger.id === id; }); };
  const billFor = function (id) { return state.bills.find(function (bill) { return bill.id === id; }); };
  const activeLedger = function () { return ledgerFor(state.activeLedger); };

  function toast(message) {
    const node = $("#toast");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { node.classList.remove("show"); }, 4200);
  }

  function setMessage(kind, title, detail) {
    state.message = { kind:kind, title:title, detail:detail || "" };
  }

  function messageHtml() {
    if (!state.message) return "";
    return '<div class="notice ' + escapeAttr(state.message.kind) + '"><div><b>' + escapeHtml(state.message.title) + '</b>' + escapeHtml(state.message.detail) + '</div></div>';
  }

  function button(label, action, extra) {
    return '<button type="button" class="btn ' + (extra || "") + '" data-act="' + action + '">' + label + "</button>";
  }

  function renderBrand() {
    return '<a class="brand" href="#" data-act="home"><span class="brand-mark">Rx</span><span>RxPx<small>HOSPITALS</small></span></a>';
  }

  function render() {
    const app = $("#app");
    if (state.view === "setup") app.innerHTML = setupView();
    else if (state.view === "auth" || state.view === "boot") app.innerHTML = authView();
    else app.innerHTML = appView();
    if (state.view === "dashboard") setTimeout(drawCharts, 0);
  }

  function setupView() {
    return '<main class="setup">' +
      renderBrand() +
      '<div class="card card-pad" style="margin-top:34px">' +
        '<div class="eyebrow">One-time connection</div>' +
        '<h1>Connect your secure data workspace</h1>' +
        '<p class="sub">This app deliberately will not use browser-only accounts or shared local storage. Add your Supabase Project URL and publishable/anon key in <b>APP_CONFIG</b>, then run the supplied SQL file once.</p>' +
        '<div class="notice warn"><div><b>Why setup is required</b>Real authentication, account isolation, database records, original bill files, and duplicate protection must be enforced by Supabase Row Level Security—not only by the browser.</div></div>' +
        '<ol class="fine" style="padding-left:19px"><li>Create a Supabase project.</li><li>Run <b>supabase-setup.sql</b> in its SQL Editor.</li><li>Copy Project URL and the publishable/anon key from Connect, then fill APP_CONFIG near the top of this file.</li><li>Reload this page and create the first account.</li></ol>' +
        '<div class="codebox">const APP_CONFIG = Object.freeze({\n  supabaseUrl: "https://YOUR-PROJECT.supabase.co",\n  supabaseAnonKey: "YOUR-PUBLISHABLE-OR-ANON-KEY",\n  storageBucket: "bill-files"\n});</div>' +
      "</div></main>";
  }

  function authView() {
    const signup = state.authMode === "signup";
    return '<main class="auth-wrap">' +
      '<section class="auth-hero">' +
        renderBrand() +
        '<div class="hero-copy"><div class="eyebrow" style="color:#ffb561">BILL INTELLIGENCE</div><h1>Every bill, clear enough to act on.</h1><p>Securely read, review, store, and understand bills for your hospital or pharmacy—without mixing one account’s records with another.</p><div class="hero-points"><div class="hero-point"><span class="tick">✓</span> OCR results always go through a review screen</div><div class="hero-point"><span class="tick">✓</span> Dashboard totals and charts update after every save</div><div class="hero-point"><span class="tick">✓</span> Duplicate bills are blocked unless you explicitly override</div></div></div>' +
        '<p style="color:#d9cabe;font-size:12px">Your files and records are protected by Supabase authentication and Row Level Security.</p>' +
      '</section>' +
      '<section class="auth-panel"><div class="auth-card">' +
        '<div class="eyebrow">' + (signup ? "Create your workspace" : "Welcome back") + '</div>' +
        '<h1>' + (signup ? "Start securely" : "Sign in to your bills") + '</h1>' +
        '<p class="sub">' + (signup ? "Use an email that can receive a confirmation link." : "Use the account that owns these bill records.") + '</p>' +
        '<div class="tabs"><button class="' + (!signup ? "on" : "") + '" data-act="signinTab">Sign in</button><button class="' + (signup ? "on" : "") + '" data-act="signupTab">Sign up</button></div>' +
        '<form data-form="auth">' +
          (signup ? '<label class="field"><span>Full name</span><input name="name" autocomplete="name" required maxlength="100" placeholder="Your name"></label>' : "") +
          '<label class="field"><span>Email address</span><input name="email" autocomplete="email" type="email" required placeholder="you@example.com"></label>' +
          '<label class="field"><span>Password</span><input name="password" autocomplete="' + (signup ? "new-password" : "current-password") + '" type="password" minlength="8" required placeholder="At least 8 characters"></label>' +
          (signup ? '<label class="field"><span>Confirm password</span><input name="confirmPassword" autocomplete="new-password" type="password" minlength="8" required placeholder="Repeat password"></label>' : "") +
          messageHtml() +
          '<button class="btn primary wide" type="submit">' + (signup ? "Create secure account" : "Sign in") + "</button>" +
        '</form>' +
        '<p class="fine">Only the public Supabase key belongs in this page. Your password is sent to Supabase Auth and is never stored by this app.</p>' +
      "</div></section></main>";
  }

  function appView() {
    return '<div class="shell"><header class="topbar">' + renderBrand() +
      '<div class="top-actions"><span class="user-chip">' + escapeHtml(state.user && state.user.email || "") + '</span><button type="button" class="btn small" data-act="logout">Sign out</button></div>' +
      '</header><main class="app-layout"><aside class="side"><div class="side-label">Workspace</div><nav class="nav">' +
      navButton("dashboard","▦","Dashboard") + navButton("choose","＋","Add bill") + navButton("reports","◔","Reports & Excel") +
      '</nav></aside><section class="content">' + pageContent() + "</section></main></div>";
  }

  function navButton(view, icon, label) {
    const selected = (view === "choose" ? ["choose","new-ledger","existing-ledger","upload","review"].includes(state.view) : state.view === view);
    return '<button class="' + (selected ? "on" : "") + '" data-act="route" data-view="' + view + '"><span class="nav-ico">' + icon + "</span>" + label + "</button>";
  }

  function pageContent() {
    if (state.view === "dashboard") return dashboardView();
    if (state.view === "choose") return chooseView();
    if (state.view === "new-ledger") return newLedgerView();
    if (state.view === "existing-ledger") return existingLedgerView();
    if (state.view === "ledger") return ledgerView();
    if (state.view === "upload") return uploadView();
    if (state.view === "review") return reviewView();
    if (state.view === "detail") return detailView();
    if (state.view === "reports") return reportsView();
    return dashboardView();
  }

  function pageHeader(title, text, action) {
    return '<div class="page-head"><div><h1>' + title + '</h1><p>' + text + "</p></div>" + (action || "") + "</div>";
  }

  function totals() {
    return state.bills.reduce(function (acc, bill) {
      const total = Number(bill.total || 0);
      if (bill.bill_type === "income") acc.income += total;
      else acc.expense += total;
      return acc;
    }, { income:0, expense:0 });
  }

  function ledgerStats(id) {
    return state.bills.filter(function (bill) { return bill.ledger_id === id; }).reduce(function (acc, bill) {
      acc.count += 1;
      if (bill.bill_type === "income") acc.income += Number(bill.total || 0);
      else acc.expense += Number(bill.total || 0);
      if (!acc.latest || new Date(bill.created_at) > new Date(acc.latest.created_at)) acc.latest = bill;
      return acc;
    }, { count:0, income:0, expense:0, latest:null });
  }

  function dashboardView() {
    const sum = totals();
    const balance = sum.income - sum.expense;
    const recent = state.bills.slice(0,8);
    return pageHeader("Dashboard", "A simple, current view of every bill saved to this account.", '<button class="btn primary" data-act="route" data-view="choose">Add a bill</button>') +
      '<div class="summary-grid">' +
        summaryCard("Income",money(sum.income),count(state.bills.filter(function (b) { return b.bill_type === "income"; }).length,"income bill"),"income") +
        summaryCard("Expenses",money(sum.expense),count(state.bills.filter(function (b) { return b.bill_type !== "income"; }).length,"expense bill"),"expense") +
        summaryCard("Net balance",money(balance),balance >= 0 ? "Income minus expenses" : "Expenses exceed income","") +
      '</div>' +
      '<div class="dashboard-grid"><section class="card"><div class="card-head"><div><h2>Money movement</h2><p>Income, expenses, and current net amount</p></div></div><div class="chart-wrap"><canvas id="moneyChart" aria-label="Income versus expenses chart"></canvas></div></section>' +
      '<section class="card"><div class="card-head"><div><h2>Bill groups</h2><p>Open a name to see its bills</p></div><button class="btn small" data-act="route" data-view="choose">Add</button></div><div class="ledger-list">' +
        (state.ledgers.length ? state.ledgers.slice(0,6).map(ledgerRow).join("") : '<div class="empty"><div class="empty-icon">▣</div><b>No bill names yet</b><p>Create a bill name before your first upload.</p></div>') +
      '</div></section></div>' +
      '<section class="card activity"><div class="card-head"><div><h2>Recent uploads</h2><p>Click a row to view all extracted details and the original file.</p></div><button class="btn small" data-act="route" data-view="reports">Excel</button></div><div class="bill-list">' +
        (recent.length ? recent.map(billRow).join("") : '<div class="empty"><div class="empty-icon">⌁</div><b>No bills saved</b><p>Your reviewed uploads will appear here.</p></div>') +
      "</div></section>";
  }

  function summaryCard(label, amount, hint, className) {
    return '<section class="summary ' + className + '"><div class="label">' + label + '</div><div class="amount">' + amount + '</div><div class="hint">' + hint + "</div></section>";
  }

  function ledgerRow(ledger) {
    const stats = ledgerStats(ledger.id);
    const net = stats.income - stats.expense;
    return '<button class="ledger-row" data-act="openLedger" data-id="' + ledger.id + '"><div><div class="ledger-name">' + escapeHtml(ledger.name) + '</div><div class="ledger-meta">' + count(stats.count,"upload") + (stats.latest ? " · Last " + dateText(stats.latest.created_at,false) : "") + '</div></div><div class="ledger-total ' + (net < 0 ? "expense" : "income") + '">' + money(net) + "</div></button>";
  }

  function billRow(bill) {
    const ledger = ledgerFor(bill.ledger_id);
    const income = bill.bill_type === "income";
    return '<button class="bill-row" data-act="openBill" data-id="' + bill.id + '"><span class="bill-badge ' + (income ? "income" : "") + '">' + (income ? "↗" : "↙") + '</span><span><span class="bill-name">' + escapeHtml(ledger ? ledger.name : "Untitled bill") + '</span><span class="bill-meta">' + escapeHtml(bill.vendor || "No vendor") + " · " + dateText(bill.created_at,true) + '</span></span><span class="bill-value ' + (income ? "income" : "expense") + '">' + (income ? "+" : "−") + money(bill.total) + "</span></button>";
  }

  function chooseView() {
    return pageHeader("Add a bill", "Choose whether this is a new bill name or another upload for a name you already created.") +
      '<div class="choice-grid"><button class="choice" data-act="newLedger"><span class="choice-icon">＋</span><h2>New bill</h2><p>Create a new bill name, then capture or upload its first bill.</p><small>CREATE A NEW NAME →</small></button>' +
      '<button class="choice" data-act="existingLedger" ' + (!state.ledgers.length ? "disabled" : "") + '><span class="choice-icon">▣</span><h2>Existing bill</h2><p>' + (state.ledgers.length ? "Select a previously entered bill name and add another bill." : "Available after you create your first bill name.") + '</p><small>' + (state.ledgers.length ? "SELECT A SAVED NAME →" : "NO SAVED NAMES YET") + "</small></button></div>" + messageHtml();
  }

  function newLedgerView() {
    return pageHeader("Create a bill name", "This name groups related uploads. You can select it again whenever you add another bill.") +
      '<form class="card form-card" style="max-width:610px" data-form="newLedger"><label class="field" style="margin-top:0"><span>Bill name</span><input name="ledgerName" required maxlength="120" autofocus placeholder="Example: Apollo Pharmacy — October 2026"></label><p class="fine">Use a recognizable name. The same account cannot create the same name twice.</p>' + messageHtml() + '<div class="form-actions"><button type="button" class="btn" data-act="route" data-view="choose">Cancel</button><button type="submit" class="btn primary">Continue to upload</button></div></form>';
  }

  function existingLedgerView() {
    return pageHeader("Choose an existing bill", "Each selection opens a new upload flow but keeps this bill under the selected name.") +
      (state.ledgers.length ? '<div class="ledger-grid">' + state.ledgers.map(function (ledger) {
        const stats = ledgerStats(ledger.id);
        const net = stats.income - stats.expense;
        return '<button class="ledger-card" data-act="useLedger" data-id="' + ledger.id + '"><span class="choice-icon">▣</span><h3>' + escapeHtml(ledger.name) + '</h3><p>' + count(stats.count,"saved bill") + (stats.latest ? " · Last upload " + dateText(stats.latest.created_at,false) : "") + '</p><span class="net ' + (net < 0 ? "negative" : "") + '">' + money(net) + "</span></button>";
      }).join("") + '</div>' : '<div class="empty">There are no saved bill names yet.</div>');
  }

  function ledgerView() {
    const ledger = activeLedger();
    if (!ledger) return existingLedgerView();
    const bills = state.bills.filter(function (bill) { return bill.ledger_id === ledger.id; });
    const stats = ledgerStats(ledger.id);
    return pageHeader(escapeHtml(ledger.name), count(stats.count,"saved bill") + " · Net " + money(stats.income - stats.expense), '<button class="btn primary" data-act="uploadToActive">Add another bill</button>') +
      '<section class="card activity"><div class="card-head"><div><h2>Uploads in this bill name</h2><p>Each row includes the bill amount, bill date, and exact upload date/time.</p></div><button class="btn small" data-act="existingLedger">All names</button></div><div class="bill-list">' +
      (bills.length ? bills.map(billRow).join("") : '<div class="empty"><div class="empty-icon">◫</div><b>No uploads under this name</b><p>Use “Add another bill” to capture or upload the first bill.</p></div>') +
      "</div></section>";
  }

  function uploadView() {
    const ledger = activeLedger();
    if (!ledger) return chooseView();
    const file = state.file;
    return pageHeader("Capture or upload a bill", "Selected bill name: " + escapeHtml(ledger.name), button("Change bill name","existingLedger","small")) +
      '<div class="upload-layout"><section class="drop-zone" id="dropZone"><div><div class="upload-icon">⌁</div><h2>Bring in the bill</h2><p>Take a clear photo, choose one from the gallery, or upload a PDF. We will read it and show every value for your review before saving.</p><div class="upload-buttons"><label class="btn primary" for="cameraInput">Open camera</label><label class="btn" for="galleryInput">Gallery</label><label class="btn" for="fileInput">Upload file</label></div><input id="cameraInput" data-file-source="camera" type="file" accept="image/*" capture="environment"><input id="galleryInput" data-file-source="gallery" type="file" accept="image/*"><input id="fileInput" data-file-source="file" type="file" accept="image/*,application/pdf,.pdf"></div></section>' +
      '<aside class="card file-card">' + (file ? fileCard(file) : '<div class="empty"><div class="empty-icon">◫</div><b>No file selected</b><p>The original file will be stored privately with this bill after you confirm the extracted details.</p></div>') + "</aside></div>" + messageHtml();
  }

  function fileCard(file) {
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    return '<div class="file-preview">' + (file.preview ? '<img src="' + escapeAttr(file.preview) + '" alt="Selected bill preview">' : '<span class="pdf-mark">' + (isPdf ? "PDF" : "FILE") + "</span>") + '</div><div class="file-info"><b title="' + escapeAttr(file.name) + '">' + escapeHtml(file.name) + '</b><span>' + fileSize(file.size) + " · " + (isPdf ? "PDF document" : "Image") + '</span>' +
      '<div class="scan-box"><div class="scan-top"><span id="scanStatus">' + escapeHtml(state.scanStatus || "Ready to scan") + '</span><span id="scanPercent">' + Math.round(state.scanProgress || 0) + '%</span></div><div class="progress"><i id="scanBar" style="width:' + Math.round(state.scanProgress || 0) + '%"></i></div></div>' +
      '<div class="form-actions"><button class="btn small" data-act="removeFile">Remove</button>' + (state.busy ? '<button class="btn primary small" disabled>Reading…</button>' : '<button class="btn primary small" data-act="scanAgain">Read bill</button>') + "</div></div>";
  }

  function reviewView() {
    const ledger = activeLedger();
    if (!ledger || !state.file) return uploadView();
    const d = state.parsed;
    const confidenceText = d.confidence >= 80 ? "Most key fields were found, but check them before saving." : "Some fields are uncertain. Check the original bill and correct every value.";
    return '<div class="review-wrap">' +
      '<div class="review-top"><div><div class="eyebrow">Review before saving</div><h1>Confirm the bill details</h1><p class="source">Bill name: <b>' + escapeHtml(ledger.name) + '</b> · Source: ' + escapeHtml(state.file.name) + '</p></div><span class="pill ' + (d.confidence >= 80 ? "green" : "") + '">OCR confidence ' + Math.round(d.confidence) + '%</span></div>' +
      '<div class="notice ' + (d.confidence >= 80 ? "info" : "warn") + '"><div><b>Do not rely on OCR alone.</b>' + confidenceText + ' The database changes only after you check the confirmation box and save.</div></div>' +
      (state.duplicateBills.length ? '<div class="notice warn"><div><b>Possible duplicate found.</b>This exact file was already saved ' + state.duplicateBills.length + " time" + (state.duplicateBills.length === 1 ? "" : "s") + ' in this account. It is blocked by default; use the explicit override below only if this is intentional.</div></div>' : "") +

  }

  function itemRows(items) {
    if (!items.length) return '<tr><td colspan="5" class="muted">No reliable line items were read. Add important rows manually if needed.</td></tr>';
    return items.map(function (item, index) {
      return '<tr data-item-row="' + index + '"><td><input class="item-description" name="itemDescription" value="' + escapeAttr(item.description || "") + '" placeholder="Description"></td><td><input name="itemQuantity" inputmode="decimal" value="' + escapeAttr(item.quantity || "") + '" placeholder="—"></td><td><input name="itemRate" inputmode="decimal" value="' + escapeAttr(item.rate || "") + '" placeholder="—"></td><td><input name="itemAmount" inputmode="decimal" value="' + escapeAttr(item.amount || "") + '" placeholder="0.00"></td><td><button class="icon-button" type="button" data-act="removeItem" data-index="' + index + '" aria-label="Remove line">×</button></td></tr>';
    }).join("");
  }

  async function init() {
    if (!configured || !db) {
      state.view = "setup";
      render();
      return;
    }
    render();
    try {
      const response = await db.auth.getSession();
      state.user = response.data.session ? response.data.session.user : null;
      if (state.user) {
        await refreshData();
        state.view = "dashboard";
      } else state.view = "auth";
    } catch (error) {
      state.view = "auth";
      setMessage("error","Could not connect to Supabase.", error.message || "Check APP_CONFIG and your internet connection.");
    }
    render();
    db.auth.onAuthStateChange(function (event, session) {
      setTimeout(async function () {
        state.user = session ? session.user : null;
        if (state.user) {
          try {
            await refreshData();
            state.view = "dashboard";
          } catch (error) {
            setMessage("error","Could not load this account’s bills.", error.message || "Check Supabase policies.");
          }
        } else {
          resetPrivateState();
          state.view = "auth";
        }
        render();
      },0);
    });
  }

  function resetPrivateState() {
    state.ledgers = [];
    state.bills = [];
    state.activeLedger = null;
    removeSelectedFile();
    state.detailId = null;
    state.message = "";
  }

  async function refreshData() {
    if (!db || !state.user) return;
    const result = await Promise.all([
      db.from("bill_ledgers").select("id,name,created_at").order("created_at",{ascending:true}),
      db.from("bills").select("id,ledger_id,bill_type,vendor,bill_number,bill_date,total,items,source_hash,original_file_name,storage_path,file_size,ocr_text,extraction_confidence,force_uploaded,created_at").order("created_at",{ascending:false})
    ]);
    if (result[0].error) throw result[0].error;
    if (result[1].error) throw result[1].error;
    state.ledgers = result[0].data || [];
    state.bills = result[1].data || [];
  }

  async function handleAuth(form) {
    if (!db) return;
    const values = new FormData(form);
    const email = String(values.get("email") || "").trim();
    const password = String(values.get("password") || "");
    const signup = state.authMode === "signup";
    state.message = "";
    if (signup && password !== String(values.get("confirmPassword") || "")) {
      setMessage("error","Passwords do not match.","Enter the same password twice.");
      render();
      return;
    }
    state.busy = true;
    render();
    try {
      if (signup) {
        const result = await db.auth.signUp({
          email:email, password:password,
          options:{ data:{ full_name:String(values.get("name") || "").trim() } }
        });
        if (result.error) throw result.error;
        if (!result.data.session) {
          setMessage("success","Check your email.","Supabase sent a confirmation link. After confirming, sign in here.");
          state.authMode = "signin";
        }
      } else {
        const result = await db.auth.signInWithPassword({ email:email, password:password });
        if (result.error) throw result.error;
      }
    } catch (error) {
      setMessage("error",signup ? "Account could not be created." : "Sign-in failed.", error.message || "Please try again.");
    } finally {
      state.busy = false;
      render();
    }
  }

  async function createLedger(form) {
    const name = String(new FormData(form).get("ledgerName") || "").trim();
    if (!name) return;
    state.busy = true;
    state.message = "";
    render();
    try {
      const result = await db.from("bill_ledgers").insert({ user_id:state.user.id, name:name }).select("id,name,created_at").single();
      if (result.error) throw result.error;
      state.ledgers.push(result.data);
      state.activeLedger = result.data.id;
      state.view = "upload";
    } catch (error) {
      setMessage("error","Could not create that bill name.", error.message && /duplicate/i.test(error.message) ? "Use a different name or choose the existing bill." : error.message || "Please try again.");
    } finally {
      state.busy = false;
      render();
    }
  }

  async function hashFile(file) {
    const bytes = await file.arrayBuffer();
    const hash = await crypto.subtle.digest("SHA-256",bytes);
    return Array.from(new Uint8Array(hash)).map(function (byte) { return byte.toString(16).padStart(2,"0"); }).join("");
  }

  async function selectFile(file) {
    if (!file) return;
    const allowed = /^image\//.test(file.type) || file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    if (!allowed) {
      setMessage("error","Choose a bill image or PDF.","Supported files are JPG, PNG, WEBP, HEIC where the browser supports it, and PDF.");
      render();
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      setMessage("error","That file is too large.","Choose a file smaller than 25 MB.");
      render();
      return;
    }
    removeSelectedFile();
    state.file = { source:file, name:file.name, type:file.type, size:file.size, preview:/^image\//.test(file.type) ? URL.createObjectURL(file) : "", hash:"" };
    state.rawText = "";
    state.parsed = freshDraft();
    state.duplicateBills = [];
    state.forceDuplicate = false;
    state.message = "";
    state.scanStatus = "Checking file…";
    state.scanProgress = 3;
    render();
    try {
      state.file.hash = await hashFile(file);
      await checkDuplicate(state.file.hash);
      await scanSelectedFile();
    } catch (error) {
      setMessage("error","This file could not be prepared.", error.message || "Try a clearer, smaller image or PDF.");
      state.scanStatus = "Could not read file";
      state.scanProgress = 0;
      render();
    }
  }

  async function checkDuplicate(hash) {
    const result = await db.from("bills").select("id,bill_number,created_at,ledger_id").eq("source_hash",hash).limit(10);
    if (result.error) throw result.error;
    state.duplicateBills = result.data || [];
  }

  function setScanProgress(status, progress) {
    state.scanStatus = status;
    state.scanProgress = Math.max(0,Math.min(100,progress || 0));
    const statusNode = $("#scanStatus");
    const percentNode = $("#scanPercent");
    const bar = $("#scanBar");
    if (statusNode) statusNode.textContent = status;
    if (percentNode) percentNode.textContent = Math.round(state.scanProgress) + "%";
    if (bar) bar.style.width = Math.round(state.scanProgress) + "%";
  }

  async function scanSelectedFile() {
    if (!state.file || state.busy) return;
    state.busy = true;
    state.message = "";
    setScanProgress("Preparing OCR…",7);
    render();
    try {
      const file = state.file.source;
      let text = "";
      if (/^image\//.test(file.type)) {
        text = await ocrImage(file,7,92);
      } else {
        text = await ocrPdf(file);
      }
      if (!text.trim()) throw new Error("No readable text was found. Try a brighter, sharper photo or enter the details manually.");
      state.rawText = text;
      state.parsed = parseBillText(text);
      state.view = "review";
      setScanProgress("Ready for review",100);
    } catch (error) {
      state.view = "upload";
      setMessage("error","The bill could not be read automatically.", error.message || "You can choose another photo or PDF.");
      setScanProgress("OCR needs another file",0);
    } finally {
      state.busy = false;
      render();
    }
  }

  async function ocrImage(image, start, end) {
    if (!window.Tesseract) throw new Error("OCR library did not load. Check your internet connection and reload.");
    const result = await window.Tesseract.recognize(image,"eng",{
      logger:function (message) {
        const fraction = typeof message.progress === "number" ? message.progress : 0;
        const label = message.status ? String(message.status).replace(/_/g," ") : "Reading image";
        setScanProgress(label,start + (end - start) * fraction);
      }
    });
    return result && result.data ? result.data.text : "";
  }

  async function ocrPdf(file) {
    if (!window.pdfjsLib) throw new Error("PDF reader did not load. Check your internet connection and reload.");
    setScanProgress("Opening PDF…",10);
    const documentData = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data:documentData }).promise;
    const pageCount = Math.min(pdf.numPages,3);
    let combined = "";
    for (let pageNumber = 1; pageNumber <= pageCount; pageNumber += 1) {
      setScanProgress("Reading PDF page " + pageNumber + " of " + pageCount,12 + ((pageNumber - 1) / pageCount) * 78);
      const page = await pdf.getPage(pageNumber);
      const viewport = page.getViewport({ scale:2 });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      await page.render({ canvasContext:canvas.getContext("2d"), viewport:viewport }).promise;
      const blob = await new Promise(function (resolve) { canvas.toBlob(resolve,"image/png"); });
      if (blob) combined += "\n" + await ocrImage(blob,14 + ((pageNumber - 1) / pageCount) * 76,14 + (pageNumber / pageCount) * 76);
    }
    return combined;
  }

  function parseMoney(value) {
    const cleaned = String(value == null ? "" : value).replace(/[₹,\s]/g,"").replace(/(?:INR|RS\.?)/ig,"").replace(/[^\d.-]/g,"");
    const number = Number(cleaned);
    return Number.isFinite(number) && number >= 0 ? number : null;
  }

  function normalizeDate(raw) {
    const value = String(raw || "").trim().replace(/[.]/g,"/");
    let match = value.match(/\b(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\b/);
    if (match) return match[1] + "-" + String(match[2]).padStart(2,"0") + "-" + String(match[3]).padStart(2,"0");
    match = value.match(/\b(\d{1,2})[-/](\d{1,2})[-/](20\d{2}|\d{2})\b/);
    if (match) {
      let day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
      if (year < 100) year += 2000;
      if (day <= 12 && month > 12) { const swap = day; day = month; month = swap; }
      if (month >= 1 && month <= 12 && day >= 1 && day <= 31) return String(year) + "-" + String(month).padStart(2,"0") + "-" + String(day).padStart(2,"0");
    }
    const named = value.match(/\b(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)[,]?\s+(20\d{2})\b/i);
    if (named) {
      const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
      const month = months[named[2].slice(0,3).toLowerCase()];
      return named[3] + "-" + String(month).padStart(2,"0") + "-" + String(named[1]).padStart(2,"0");
    }
    return "";
  }

  function parseBillText(text) {
    const lines = String(text || "").replace(/\r/g,"").split("\n").map(function (line) { return line.replace(/\s+/g," ").trim(); }).filter(Boolean);
    const upper = lines.join("\n").toUpperCase();
    const draft = freshDraft();
    const totalLabels = /(grand\s*total|net\s*(amount|payable)|amount\s*payable|invoice\s*total|total\s*amount|bill\s*amount|balance\s*due|total)/i;
    const invoiceLabels = /(invoice|bill|receipt|tax\s*invoice)\s*(no|number|#|:)?\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i;
    const dateLabels = /(invoice|bill|receipt|date|dated)\D{0,15}(\d{1,2}[\/.-]\d{1,2}[\/.-](?:20)?\d{2}|\d{4}[\/.-]\d{1,2}[\/.-]\d{1,2}|\d{1,2}\s+[A-Za-z]{3,9}\s+20\d{2})/i;
    const bannedVendor = /(tax invoice|cash memo|invoice|bill|gstin|phone|mobile|address|date|serial)/i;
    let score = 0;
    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];
      if (!draft.vendor && /[A-Za-z]{3}/.test(line) && !bannedVendor.test(line) && line.length < 90) {
        draft.vendor = line.replace(/^[^A-Za-z]+/,"").trim();
      }
      const invoice = line.match(invoiceLabels);
      if (!draft.billNumber && invoice) draft.billNumber = invoice[3];
      const date = line.match(dateLabels);
      if (!draft.billDate && date) draft.billDate = normalizeDate(date[2]);
    }
    if (!draft.billDate) {
      for (let d = 0; d < lines.length; d += 1) {
        const found = normalizeDate(lines[d]);
        if (found) { draft.billDate = found; break; }
      }
    }
    const candidates = [];
    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];
      if (totalLabels.test(line)) {
        const amounts = line.match(/(?:₹|INR|RS\.?\s*)?\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?/ig) || [];
        amounts.forEach(function (amount) {
          const parsed = parseMoney(amount);
          if (parsed != null && parsed > 0) candidates.push({ value:parsed, weight:totalLabels.test(line) ? 3 : 1, index:i });
        });
      }
    }
    if (candidates.length) {
      candidates.sort(function (a,b) { return b.weight - a.weight || b.index - a.index || b.value - a.value; });
      draft.total = String(candidates[0].value);
    }
    const saleWords = /(sale|sales|customer|received from|cash sale)/i;
    const expenseWords = /(purchase|supplier|vendor|paid to|medicine purchase)/i;
    if (saleWords.test(upper) && !expenseWords.test(upper)) draft.billType = "income";
    const skipLine = /(grand total|net total|sub total|cgst|sgst|igst|tax|discount|round off|amount payable|invoice no|bill no|date)/i;
    for (let i = 0; i < lines.length && draft.items.length < 35; i += 1) {
      const line = lines[i];
      if (skipLine.test(line) || !/[A-Za-z]{2}/.test(line)) continue;
      const numbers = line.match(/(?<![A-Za-z])\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?(?![A-Za-z])/g) || [];
      if (numbers.length < 2) continue;
      const values = numbers.map(parseMoney).filter(function (n) { return n != null; });
      if (values.length < 2) continue;
      const description = line.replace(/(?:₹|INR|RS\.?\s*)?\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?/ig,"").replace(/\s+/g," ").replace(/[-|]+/g," ").trim();
      if (description.length < 2) continue;
      const amount = values[values.length - 1];
      const quantity = values.length >= 3 ? values[0] : "";
      const rate = values.length >= 3 ? values[values.length - 2] : "";
      if (amount > 0) draft.items.push({ description:description.slice(0,180), quantity:quantity, rate:rate, amount:amount });
    }
    if (draft.vendor) score += 24;
    if (draft.billNumber) score += 16;
    if (draft.billDate) score += 18;
    if (draft.total) score += 30;
    if (draft.items.length) score += Math.min(12,draft.items.length * 3);
    draft.confidence = Math.min(95,score);
    return draft;
  }

  function syncDraftFromReview() {
    const form = $("#reviewForm");
    if (!form) return;
    const values = new FormData(form);
    const descriptions = values.getAll("itemDescription");
    const quantities = values.getAll("itemQuantity");
    const rates = values.getAll("itemRate");
    const amounts = values.getAll("itemAmount");
    state.parsed = {
      billType:String(values.get("billType") || "expense"),
      vendor:String(values.get("vendor") || ""),
      billNumber:String(values.get("billNumber") || ""),
      billDate:String(values.get("billDate") || ""),
      total:String(values.get("total") || ""),
      confidence:state.parsed.confidence || 0,
      items:descriptions.map(function (description,index) {
        return { description:String(description || ""), quantity:String(quantities[index] || ""), rate:String(rates[index] || ""), amount:String(amounts[index] || "") };
      }).filter(function (item) { return item.description.trim() || item.amount; })
    };
  }

  async function saveBill(form) {
    const values = new FormData(form);
    syncDraftFromReview();
    const d = state.parsed;
    const total = parseMoney(d.total);
    if (total == null || total <= 0) {
      setMessage("error","Enter a valid total amount.","The bill cannot be saved without a positive total.");
      render();
      return;
    }
    if (!d.billDate) {
      setMessage("error","Enter the bill date.","Check it against the original document.");
      render();
      return;
    }
    const force = values.get("forceDuplicate") === "on";
    if (state.duplicateBills.length && !force) {
      setMessage("warn","Duplicate blocked.","Tick the explicit force-upload choice only when this duplicate is intentional.");
      render();
      return;
    }
    state.busy = true;
    render();
    let storagePath = "";
    try {
      const safeName = state.file.name.replace(/[^a-zA-Z0-9._-]+/g,"-");
      storagePath = state.user.id + "/" + state.activeLedger + "/" + Date.now() + "-" + safeName;
      const upload = await db.storage.from(APP_CONFIG.storageBucket).upload(storagePath,state.file.source,{
        cacheControl:"3600", upsert:false, contentType:state.file.type || undefined
      });
      if (upload.error) throw upload.error;
      const itemRows = d.items.map(function (item) {
        return {
          description:item.description.trim(),
          quantity:parseMoney(item.quantity),
          rate:parseMoney(item.rate),
          amount:parseMoney(item.amount)
        };
      }).filter(function (item) { return item.description || item.amount != null; });
      const result = await db.rpc("save_bill_with_duplicate_guard",{
        p_ledger_id:state.activeLedger,
        p_bill_type:d.billType,
        p_vendor:d.vendor.trim() || null,
        p_bill_number:d.billNumber.trim() || null,
        p_bill_date:d.billDate,
        p_total:total,
        p_items:itemRows,
        p_source_hash:state.file.hash,
        p_original_file_name:state.file.name,
        p_storage_path:storagePath,
        p_file_size:state.file.size,
        p_ocr_text:state.rawText.slice(0,50000),
        p_extraction_confidence:Math.round(d.confidence || 0),
        p_force_duplicate:force
      });
      if (result.error) throw result.error;
      await refreshData();
      removeSelectedFile();
      state.parsed = freshDraft();
      state.rawText = "";
      state.duplicateBills = [];
      state.activeLedger = null;
      state.detailId = result.data && result.data.id || null;
      state.view = "dashboard";
      toast(force ? "Duplicate saved with an override flag." : "Reviewed bill saved and dashboard updated.");
    } catch (error) {
      if (storagePath) await db.storage.from(APP_CONFIG.storageBucket).remove([storagePath]);
      const duplicate = error && (error.code === "23505" || /duplicate/i.test(error.message || ""));
      setMessage(duplicate ? "warn" : "error", duplicate ? "Duplicate blocked by the database." : "Bill was not saved.", duplicate ? "Someone may have saved the same file just now. Use the explicit override only if intentional." : error.message || "Check your Supabase setup and try again.");
    } finally {
      state.busy = false;
      render();
    }
  }

  async function openOriginal(id) {
    const bill = billFor(id);
    if (!bill || !bill.storage_path) return;
    const result = await db.storage.from(APP_CONFIG.storageBucket).createSignedUrl(bill.storage_path,60);
    if (result.error) {
      toast("Could not open the original: " + result.error.message);
      return;
    }
    window.open(result.data.signedUrl,"_blank","noopener");
  }

  async function deleteBill(id) {
    const bill = billFor(id);
    if (!bill) return;
    if (!window.confirm("Delete this bill? This removes it from the dashboard and cannot be undone.")) return;
    try {
      const result = await db.from("bills").delete().eq("id",id);
      if (result.error) throw result.error;
      if (bill.storage_path) {
        const removed = await db.storage.from(APP_CONFIG.storageBucket).remove([bill.storage_path]);
        if (removed.error) console.warn("The bill row was deleted but its file could not be removed.",removed.error);
      }
      await refreshData();
      state.view = "dashboard";
      state.detailId = null;
      toast("Bill deleted and dashboard updated.");
    } catch (error) {
      setMessage("error","Could not delete the bill.",error.message || "Please try again.");
      render();
    }
  }

  function removeSelectedFile() {
    if (state.file && state.file.preview) URL.revokeObjectURL(state.file.preview);
    state.file = null;
    state.scanStatus = "";
    state.scanProgress = 0;
  }

  function downloadExcel() {
    if (!window.XLSX) {
      toast("Excel library did not load. Check your internet connection.");
      return;
    }
    const billRows = state.bills.map(function (bill) {
      const ledger = ledgerFor(bill.ledger_id);
      return {
        "Bill name":ledger ? ledger.name : "",
        "Type":bill.bill_type === "income" ? "Income / sale" : "Expense / purchase",
        "Vendor / party":bill.vendor || "",
        "Bill number":bill.bill_number || "",
        "Bill date":bill.bill_date || "",
        "Total (INR)":Number(bill.total || 0),
        "Uploaded at":bill.created_at || "",
        "Original file":bill.original_file_name || "",
        "OCR confidence":bill.extraction_confidence == null ? "" : bill.extraction_confidence + "%",
        "Duplicate override":bill.force_uploaded ? "Yes" : "No"
      };
    });
    const itemRows = [];
    state.bills.forEach(function (bill) {
      const ledger = ledgerFor(bill.ledger_id);
      (Array.isArray(bill.items) ? bill.items : []).forEach(function (item) {
        itemRows.push({
          "Bill name":ledger ? ledger.name : "",
          "Bill number":bill.bill_number || "",
          "Bill date":bill.bill_date || "",
          "Description":item.description || "",
          "Quantity":item.quantity == null ? "" : item.quantity,
          "Rate (INR)":item.rate == null ? "" : item.rate,
          "Amount (INR)":item.amount == null ? "" : item.amount
        });
      });
    });
    const book = window.XLSX.utils.book_new();
    const billsSheet = window.XLSX.utils.json_to_sheet(billRows);
    const itemsSheet = window.XLSX.utils.json_to_sheet(itemRows);
    billsSheet["!cols"] = [{wch:30},{wch:20},{wch:28},{wch:20},{wch:14},{wch:15},{wch:22},{wch:28},{wch:16},{wch:19}];
    itemsSheet["!cols"] = [{wch:30},{wch:20},{wch:14},{wch:36},{wch:12},{wch:15},{wch:15}];
    window.XLSX.utils.book_append_sheet(book,billsSheet,"Bills");
    window.XLSX.utils.book_append_sheet(book,itemsSheet,"Line items");
    window.XLSX.writeFile(book,"RxPx-bills-" + new Date().toISOString().slice(0,10) + ".xlsx");
    toast("Current Excel report downloaded.");
  }

  function drawCharts() {
    state.charts.forEach(function (chart) { chart.destroy(); });
    state.charts = [];
    const moneyNode = $("#moneyChart");
    if (!moneyNode || !window.Chart) return;
    const sum = totals();
    state.charts.push(new window.Chart(moneyNode,{
      type:"bar",
      data:{ labels:["Income","Expenses","Net balance"], datasets:[{ data:[sum.income,sum.expense,sum.income-sum.expense], backgroundColor:["#15754b","#b42318","#ff7a00"], borderRadius:9, borderSkipped:false }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function (context) { return money(context.raw); } } } }, scales:{ y:{ beginAtZero:true, ticks:{ callback:function (value) { return "₹" + Number(value).toLocaleString("en-IN"); } }, grid:{color:"#f0eeeb"} }, x:{grid:{display:false}} } }
    }));
  }

  document.addEventListener("click",function (event) {
    const target = event.target.closest("[data-act]");
    if (!target || target.disabled) return;
    const action = target.dataset.act;
    if (action === "signinTab") { state.authMode = "signin"; state.message = ""; render(); }
    else if (action === "signupTab") { state.authMode = "signup"; state.message = ""; render(); }
    else if (action === "logout") { db.auth.signOut(); }
    else if (action === "home" || action === "dashboard") { state.view = "dashboard"; state.message = ""; render(); }
    else if (action === "route") { state.view = target.dataset.view; state.message = ""; render(); }
    else if (action === "newLedger") { state.view = "new-ledger"; state.message = ""; render(); }
    else if (action === "existingLedger") { if (state.ledgers.length) { state.view = "existing-ledger"; state.message = ""; render(); } }
    else if (action === "useLedger") { state.activeLedger = target.dataset.id; state.view = "upload"; state.message = ""; render(); }
    else if (action === "openLedger") { state.activeLedger = target.dataset.id; state.view = "ledger"; render(); }
    else if (action === "uploadToActive") { if (state.activeLedger) { state.view = "upload"; state.message = ""; render(); } }
    else if (action === "openBill") { state.detailId = target.dataset.id; state.view = "detail"; render(); }
    else if (action === "removeFile") { removeSelectedFile(); state.message = ""; render(); }
    else if (action === "scanAgain") { scanSelectedFile(); }
    else if (action === "backToUpload") { state.view = "upload"; render(); }
    else if (action === "addItem") { syncDraftFromReview(); state.parsed.items.push({description:"",quantity:"",rate:"",amount:""}); render(); }
    else if (action === "removeItem") { syncDraftFromReview(); state.parsed.items.splice(Number(target.dataset.index),1); render(); }
    else if (action === "useItemTotal") {
      syncDraftFromReview();
      const total = state.parsed.items.reduce(function (sum,item) { return sum + (parseMoney(item.amount) || 0); },0);
      state.parsed.total = total ? String(total) : state.parsed.total;
      render();
    }
    else if (action === "toggleRaw") { const raw = $("#rawText"); if (raw) raw.hidden = !raw.hidden; }
    else if (action === "openOriginal") { openOriginal(target.dataset.id); }
    else if (action === "deleteBill") { deleteBill(target.dataset.id); }
    else if (action === "downloadExcel") { downloadExcel(); }
  });

  document.addEventListener("submit",function (event) {
    const form = event.target;
    if (!form.dataset.form) return;
    event.preventDefault();
    if (form.dataset.form === "auth") handleAuth(form);
    else if (form.dataset.form === "newLedger") createLedger(form);
    else if (form.dataset.form === "saveBill") saveBill(form);
  });

  document.addEventListener("change",function (event) {
    const input = event.target;
    if (input.type === "file" && input.files && input.files[0]) selectFile(input.files[0]);
  });

  document.addEventListener("dragover",function (event) {
    if (event.target.closest("#dropZone")) { event.preventDefault(); $("#dropZone").classList.add("drag"); }
  });
  document.addEventListener("dragleave",function (event) {
    if (event.target.closest("#dropZone")) $("#dropZone").classList.remove("drag");
  });
  document.addEventListener("drop",function (event) {
    const zone = event.target.closest("#dropZone");
    if (!zone) return;
    event.preventDefault();
    zone.classList.remove("drag");
    if (event.dataTransfer.files && event.dataTransfer.files[0]) selectFile(event.dataTransfer.files[0]);
  });

  init();
  </script>
</body>
</html>
