<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7a00">
  <title>RxPx Hospital Bills</title>
  <meta name="description" content="Extract and review hospital, pharmacy, medical stock, patient, discharge, and OP bill data in Indian rupees.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --ink:#161616; --muted:#6b6b6b; --line:#e9e7e4; --soft:#f8f7f5;
      --orange:#ff7a00; --orange-soft:#fff0df; --green:#15754b; --green-soft:#e8f7ef;
      --red:#b42318; --red-soft:#ffebe9; --amber:#9a5b00; --amber-soft:#fff5dc;
      --blue:#2463b5; --radius:18px; --shadow:0 12px 34px rgba(24,20,14,.08);
    }
    * { box-sizing:border-box; }
    html { background:#fff; }
    body { margin:0; min-width:320px; color:var(--ink); background:#fff; font:15px/1.5 "DM Sans",system-ui,sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(255,122,0,.28); outline-offset:2px; }
    h1,h2,h3,p { margin:0; }
    h1,h2,h3 { font-family:Poppins,"DM Sans",sans-serif; letter-spacing:-.025em; }
    h1 { font-size:clamp(27px,4vw,40px); line-height:1.15; }
    h2 { font-size:22px; line-height:1.25; }
    h3 { font-size:16px; }
    a { color:inherit; }
    .shell { min-height:100vh; background:linear-gradient(180deg,#fff 0,#fff 55%,#fff8f1 100%); }
    .brand { display:inline-flex; align-items:center; gap:10px; font:800 24px/1 Poppins,sans-serif; letter-spacing:-.07em; text-decoration:none; }
    .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; background:var(--ink); box-shadow:inset 0 0 0 3px var(--orange); font-size:15px; letter-spacing:-.1em; }
    .brand small { display:block; margin-top:4px; color:var(--muted); font:700 9px/1 Poppins,sans-serif; letter-spacing:.24em; }
    .topbar { height:76px; display:flex; align-items:center; justify-content:space-between; gap:18px; max-width:1220px; padding:0 28px; margin:auto; border-bottom:1px solid var(--line); }
    .top-actions { display:flex; align-items:center; gap:12px; }
    .user-chip { max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:8px 11px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:13px; }
    .page { width:min(1160px,calc(100% - 40px)); margin:0 auto; padding:40px 0 70px; }
    .auth-wrap { min-height:100vh; display:grid; grid-template-columns:minmax(0,1.12fr) minmax(390px,.88fr); }
    .auth-hero { min-height:100vh; padding:clamp(36px,7vw,96px); color:#fff; background:radial-gradient(circle at 85% 12%,#ffb25f 0,transparent 26%),linear-gradient(140deg,#151515 0%,#25211d 62%,#633a13 100%); display:flex; flex-direction:column; justify-content:space-between; }
    .auth-hero .brand { color:#fff; }
    .auth-hero .brand small { color:#ffd4a8; }
    .hero-copy { max-width:570px; margin:70px 0; }
    .hero-copy h1 { max-width:520px; font-size:clamp(36px,5vw,57px); }
    .hero-copy p { max-width:500px; margin-top:20px; color:#eee7df; font-size:17px; }
    .hero-points { display:grid; gap:13px; margin-top:34px; }
    .hero-point { display:flex; align-items:center; gap:11px; color:#f7efe8; }
    .tick { width:23px; height:23px; flex:none; display:grid; place-items:center; color:#191919; background:var(--orange); border-radius:50%; font-weight:800; font-size:13px; }
    .auth-panel { display:grid; place-items:center; padding:32px; background:#fff; }
    .auth-card { width:min(440px,100%); }
    .eyebrow { margin-bottom:10px; color:var(--orange); font-weight:800; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .sub { margin-top:9px; color:var(--muted); }
    .tabs { display:flex; gap:5px; padding:5px; margin:31px 0 24px; background:var(--soft); border-radius:13px; }
    .tabs button { flex:1; min-height:42px; border:0; border-radius:9px; color:var(--muted); background:transparent; font-weight:700; }
    .tabs button.on { color:var(--ink); background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.1); }
    .field { display:block; margin-top:16px; font-weight:700; font-size:13px; }
    .field span { display:block; margin-bottom:6px; }
    .field input,.field select,.field textarea { width:100%; border:1px solid #dcd9d5; border-radius:11px; padding:12px 13px; color:var(--ink); background:#fff; font-weight:400; }
    .field textarea { min-height:94px; resize:vertical; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .btn { min-height:45px; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:#fff; font-weight:800; text-decoration:none; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .btn:hover:not(:disabled) { border-color:#c9c3bc; transform:translateY(-1px); box-shadow:0 5px 16px rgba(0,0,0,.06); }
    .btn.primary { border-color:var(--orange); color:#fff; background:var(--orange); }
    .btn.dark { border-color:var(--ink); color:#fff; background:var(--ink); }
    .btn.danger { border-color:#f1b7b1; color:var(--red); background:#fff; }
    .btn.wide { width:100%; margin-top:23px; }
    .btn.small { min-height:36px; padding:0 12px; border-radius:10px; font-size:13px; }
    .btn.link { padding:0; border:0; color:var(--blue); background:transparent; text-decoration:underline; box-shadow:none; transform:none; }
    .muted { color:var(--muted); }
    .fine { margin-top:18px; color:var(--muted); font-size:12px; line-height:1.6; }
    .notice { display:flex; gap:10px; align-items:flex-start; margin:17px 0 0; padding:12px 13px; border-radius:12px; font-size:13px; }
    .notice.info { color:#154a85; background:#eaf3ff; }
    .notice.success { color:#0d6540; background:var(--green-soft); }
    .notice.warn { color:#795000; background:var(--amber-soft); }
    .notice.error { color:#8a2119; background:var(--red-soft); }
    .notice b { display:block; margin-bottom:2px; }
    .app-layout { min-height:calc(100vh - 76px); display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1280px; margin:auto; }
    .side { padding:26px 16px; border-right:1px solid var(--line); }
    .side-label { padding:10px 12px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .nav { display:grid; gap:4px; }
    .nav button { display:flex; align-items:center; gap:11px; min-height:45px; padding:0 12px; border:0; border-radius:11px; color:var(--muted); background:transparent; text-align:left; font-weight:700; }
    .nav button:hover { color:var(--ink); background:var(--soft); }
    .nav button.on { color:var(--ink); background:var(--orange-soft); box-shadow:inset 3px 0 0 var(--orange); }
    .nav-ico { width:22px; text-align:center; }
    .content { min-width:0; padding:40px 40px 80px; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:22px; margin-bottom:28px; }
    .page-head > p { max-width:620px; margin-top:8px; color:var(--muted); }
    .summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; }
    .summary { position:relative; min-height:126px; overflow:hidden; padding:20px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.025); }
    .summary:before { position:absolute; top:0; left:0; width:5px; height:100%; content:""; background:var(--orange); }
    .summary.income:before { background:var(--green); }
    .summary.expense:before { background:var(--red); }
    .summary .label { color:var(--muted); font-size:13px; font-weight:700; }
    .summary .amount { margin-top:10px; font:700 clamp(25px,3vw,33px)/1 Poppins,sans-serif; letter-spacing:-.04em; }
    .summary .hint { margin-top:8px; color:var(--muted); font-size:12px; }
    .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr); gap:17px; margin-top:18px; }
    .card { border:1px solid var(--line); border-radius:var(--radius); background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.025); }
    .card-pad { padding:20px; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 20px 0; }
    .card-head p { margin-top:3px; color:var(--muted); font-size:13px; }
    .chart-wrap { height:260px; padding:14px 18px 20px; }
    .ledger-list { padding:12px 14px 16px; }
    .ledger-row { width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px 7px; border:0; border-bottom:1px solid var(--line); color:var(--ink); background:#fff; text-align:left; }
    .ledger-row:last-child { border-bottom:0; }
    .ledger-row:hover .ledger-name { color:var(--orange); }
    .ledger-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
    .ledger-meta { margin-top:3px; color:var(--muted); font-size:12px; }
    .ledger-total { text-align:right; font-weight:800; }
    .ledger-total.income { color:var(--green); }
    .ledger-total.expense { color:var(--red); }
    .activity { margin-top:18px; }
    .bill-list { padding:4px 20px 16px; }
    .bill-row { width:100%; display:grid; grid-template-columns:42px minmax(0,1fr) auto; align-items:center; gap:12px; padding:14px 2px; border:0; border-bottom:1px solid var(--line); color:var(--ink); background:#fff; text-align:left; }
    .bill-row:last-child { border-bottom:0; }
    .bill-row:hover .bill-name { color:var(--orange); }
    .bill-badge { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; color:var(--orange); background:var(--orange-soft); font-size:17px; }
    .bill-badge.income { color:var(--green); background:var(--green-soft); }
    .bill-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
    .bill-meta { overflow:hidden; margin-top:3px; color:var(--muted); text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .bill-value { text-align:right; font-weight:800; }
    .bill-value.income { color:var(--green); }
    .bill-value.expense { color:var(--red); }
    .choice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:17px; max-width:850px; }
    .choice { min-height:250px; padding:26px; border:1px solid var(--line); border-radius:20px; color:var(--ink); background:#fff; text-align:left; box-shadow:var(--shadow); }
    .choice:not(:disabled):hover { border-color:var(--orange); transform:translateY(-3px); }
    .choice:disabled { box-shadow:none; }
    .choice-icon { width:52px; height:52px; display:grid; place-items:center; border-radius:15px; color:var(--orange); background:var(--orange-soft); font-size:25px; }
    .choice h2 { margin-top:23px; }
    .choice p { margin-top:8px; color:var(--muted); }
    .choice small { display:block; margin-top:23px; color:var(--orange); font-weight:800; }
    .ledger-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(245px,1fr)); gap:14px; }
    .ledger-card { position:relative; min-height:170px; padding:20px; border:1px solid var(--line); border-radius:17px; color:var(--ink); background:#fff; text-align:left; box-shadow:0 4px 14px rgba(0,0,0,.025); }
    .ledger-card:hover { border-color:var(--orange); }
    .ledger-card h3 { margin-top:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ledger-card p { margin-top:5px; color:var(--muted); font-size:13px; }
    .ledger-card .net { position:absolute; bottom:18px; left:20px; color:var(--green); font-weight:800; }
    .ledger-card .net.negative { color:var(--red); }
    .empty { padding:48px 22px; border:1px dashed #d5d0ca; border-radius:18px; color:var(--muted); background:#fff; text-align:center; }
    .empty .empty-icon { margin-bottom:10px; font-size:32px; }
    .upload-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,.72fr); gap:19px; align-items:start; max-width:1050px; }
    .drop-zone { min-height:305px; padding:28px; display:grid; place-items:center; border:2px dashed #d7d1c9; border-radius:20px; background:linear-gradient(145deg,#fff,#fffaf5); text-align:center; }
    .drop-zone.drag { border-color:var(--orange); background:var(--orange-soft); }
    .drop-zone h2 { margin-top:13px; }
    .drop-zone p { max-width:390px; margin:8px auto 20px; color:var(--muted); }
    .upload-icon { width:67px; height:67px; display:grid; place-items:center; border-radius:20px; color:var(--orange); background:var(--orange-soft); font-size:32px; }
    .upload-buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
    input[type=file] { display:none; }
    .file-card { overflow:hidden; }
    .file-preview { min-height:180px; display:grid; place-items:center; overflow:hidden; background:var(--soft); }
    .file-preview img { display:block; max-width:100%; max-height:290px; object-fit:contain; }
    .pdf-mark { font-size:55px; }
    .file-info { padding:16px; }
    .file-info b,.file-info span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .file-info span { margin-top:3px; color:var(--muted); font-size:12px; }
    .scan-box { margin-top:17px; padding:15px; border-radius:14px; background:var(--soft); }
    .scan-box .scan-top { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:13px; }
    .progress { height:7px; overflow:hidden; margin-top:10px; border-radius:99px; background:#e6e2dc; }
    .progress i { display:block; width:0; height:100%; border-radius:inherit; background:var(--orange); transition:width .2s ease; }
    .review-wrap { max-width:1060px; }
    .review-top { display:flex; justify-content:space-between; gap:17px; align-items:flex-start; margin-bottom:18px; }
    .review-top .source { color:var(--muted); font-size:13px; }
    .form-card { padding:23px; }
    .form-section + .form-section { margin-top:27px; padding-top:23px; border-top:1px solid var(--line); }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .section-title p { margin-top:3px; color:var(--muted); font-size:13px; }
    .item-table-wrap { overflow:auto; margin-top:15px; border:1px solid var(--line); border-radius:13px; }
    table { width:100%; min-width:720px; border-collapse:collapse; }
    th,td { padding:10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); background:var(--soft); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
    tr:last-child td { border-bottom:0; }
    td input { width:100%; min-width:70px; border:1px solid #ddd8d1; border-radius:8px; padding:8px; }
    td .item-description { min-width:175px; }
    .icon-button { width:31px; height:31px; display:grid; place-items:center; border:1px solid #efc5c1; border-radius:8px; color:var(--red); background:#fff; }
    .checkline { display:flex; align-items:flex-start; gap:10px; margin-top:17px; padding:13px; border-radius:12px; background:#fff9f4; font-size:13px; }
    .checkline input { width:17px; height:17px; flex:none; margin:2px 0 0; accent-color:var(--orange); }
    .form-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px; margin-top:24px; }
    .detail-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; max-width:1050px; }
    .detail-hero { padding:25px; }
    .detail-kicker { color:var(--muted); font-size:13px; }
    .detail-amount { margin-top:15px; font:700 42px/1 Poppins,sans-serif; letter-spacing:-.05em; }
    .detail-amount.income { color:var(--green); }
    .detail-amount.expense { color:var(--red); }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; margin-top:26px; border-top:1px solid var(--line); }
    .details div { padding:13px 12px 13px 0; border-bottom:1px solid var(--line); }
    .details dt { color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .details dd { margin:4px 0 0; overflow-wrap:anywhere; font-weight:700; }
    .detail-side { padding:20px; }
    .detail-side > * + * { margin-top:11px; }
    .pill { display:inline-flex; align-items:center; min-height:25px; padding:0 10px; border-radius:999px; color:var(--amber); background:var(--amber-soft); font-size:12px; font-weight:800; }
    .pill.green { color:var(--green); background:var(--green-soft); }
    .report-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,.75fr); gap:18px; }
    .report-stats { display:grid; gap:10px; padding:16px; }
    .report-stat { display:flex; justify-content:space-between; gap:15px; padding:13px; border-radius:12px; background:var(--soft); }
    .report-stat b { font-weight:800; }
    .setup { width:min(800px,calc(100% - 40px)); margin:40px auto; }
    .codebox { overflow:auto; max-height:310px; margin-top:16px; padding:15px; border-radius:13px; color:#eaeaea; background:#181818; font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre; }
    #toast { position:fixed; z-index:20; right:22px; bottom:22px; max-width:min(390px,calc(100% - 44px)); padding:13px 15px; border-radius:13px; color:#fff; background:#1d1d1d; box-shadow:0 14px 35px rgba(0,0,0,.2); font-weight:700; opacity:0; pointer-events:none; transform:translateY(14px); transition:.22s ease; }
    #toast.show { opacity:1; transform:translateY(0); }
    @media (max-width:900px) {
      .auth-wrap { grid-template-columns:1fr; }
      .auth-hero { min-height:auto; padding:34px 28px; }
      .hero-copy { margin:42px 0 16px; }
      .hero-points { display:none; }
      .auth-panel { padding:45px 25px; }
      .app-layout { grid-template-columns:1fr; }
      .side { padding:10px 16px; overflow:auto; border-right:0; border-bottom:1px solid var(--line); }
      .side-label { display:none; }
      .nav { display:flex; min-width:max-content; }
      .nav button { min-width:max-content; }
      .content { padding:31px 24px 65px; }
      .dashboard-grid,.upload-layout,.detail-layout,.report-grid { grid-template-columns:1fr; }
      .detail-side { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .detail-side > * + * { margin-top:0; }
    }
    @media (max-width:620px) {
      .topbar { height:68px; padding:0 17px; }
      .user-chip { display:none; }
      .page { width:min(100% - 32px,1160px); padding-top:30px; }
      .content { padding:25px 16px 55px; }
      .page-head,.review-top { display:block; }
      .page-head .btn { margin-top:16px; }
      .summary-grid,.choice-grid,.grid2 { grid-template-columns:1fr; }
      .summary { min-height:110px; }
      .choice { min-height:205px; }
      .form-card { padding:17px; }
      .details { grid-template-columns:1fr; }
      .detail-side { grid-template-columns:1fr; }
      .form-actions { justify-content:stretch; }
      .form-actions .btn { flex:1; }
    }
    .source-table { margin-top:22px; }
    .card,.side,.field,.chart-wrap,.source-table { min-width:0; }
    .bill-row > span:nth-child(2) { min-width:0; }
    .bill-name,.bill-meta { display:block; }
    .bill-value { white-space:nowrap; }
    .chart-wrap canvas { max-width:100%; }
    .summary .amount { overflow-wrap:anywhere; }
    .source-table .fine { margin-top:6px; }
    .column-input { min-width:130px; width:100%; border:1px solid #ded8d0; border-radius:7px; padding:8px; background:#fff; font:inherit; color:var(--ink); }
    .table-pager { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; font-size:12px; color:var(--muted); }
    .currency-picker { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
    .currency-picker select { padding:11px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
    .extra-fields { display:grid; gap:10px; margin-top:15px; }
    .extra-fields .field { margin-top:0; }
    .notice ul { margin:0; padding-left:18px; }
    .notice li + li { margin-top:5px; }
    .details dd { white-space:normal; }
    .source-table td { overflow-wrap:anywhere; max-width:400px; }
    .page-head > div:last-child { flex-shrink:1; }
    summary { cursor:pointer; font-weight:700; }
    @media(max-width:900px) {
      .app-layout,.dashboard-grid,.upload-layout,.detail-layout,.report-grid { grid-template-columns:minmax(0,1fr); }
      .side { max-width:100%; }
      .section-title { flex-wrap:wrap; }
      .section-title > div { min-width:0; }
    }
    @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
