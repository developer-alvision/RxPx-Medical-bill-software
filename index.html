<style>

<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== Bill reader (offline fallback): turns OCR / PDF / spreadsheet text into bill details ===== */
const BillParser = (() => {
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  const pad = n => String(n).padStart(2, '0');
  const daysIn = (y, m) => new Date(y, m, 0).getDate();
  const mk = (y, m, d) => { if (y < 100) y += 2000; return m >= 1 && m <= 12 && d >= 1 && d <= daysIn(y, m) ? `${y}-${pad(m)}-${pad(d)}` : '' };
  const monthOf = s => { const t = String(s || '').toLowerCase().replace(/0/g, 'o'); return MONTHS[t.slice(0, 4)] || MONTHS[t.slice(0, 3)] || 0 };
  const letters = s => (String(s).match(/[A-Za-z]/g) || []).length;
  const digits = s => (String(s).match(/\d/g) || []).length;
  const round2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const near = (a, b, tol = 0.02) => a > 0 && b > 0 && Math.abs(a - b) <= Math.max(0.6, tol * Math.max(a, b));

  /* ---------- dates ---------- */
  function findDates(text, today = new Date()) {
    const out = [], t = String(text || '');
    const push = (i, y, m, d) => { const v = mk(+y, +m, +d); if (v) out.push({ i, v }) };
    let r;
    const re1 = /\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g;
    while ((r = re1.exec(t))) push(r.index, r[1], r[2], r[3]);
    const re2 = /\b(\d{1,2})(?:st|nd|rd|th)?[\s\-\/.,']*([A-Za-z0][A-Za-z0]{2,8})\.?[\s\-\/.,']*(\d{4}|\d{2})\b/g;
    while ((r = re2.exec(t))) { const m = letters(r[2]) >= 2 ? monthOf(r[2]) : 0; if (m) push(r.index, r[3], m, r[1]) }
    const re3 = /\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/g;
    while ((r = re3.exec(t))) { const m = monthOf(r[1]); if (m) push(r.index, r[3], m, r[2]) }
    const re4 = /(?<![\d\/])(\d{1,2})\s?[\/\-.]\s?(\d{1,2})\s?[\/\-.]\s?(\d{4}|\d{2})(?![\d\/])/g;
    while ((r = re4.exec(t))) {
      let a = +r[1], b = +r[2];
      if (a <= 12 && b > 12) [a, b] = [b, a]; // month/day order
      push(r.index, r[3], b, a);
    }
    const max = new Date(today); max.setDate(max.getDate() + 3);
    const lo = `${today.getFullYear() - 6}-01-01`, hi = `${max.getFullYear()}-${pad(max.getMonth() + 1)}-${pad(max.getDate())}`;
    return out.filter(x => x.v >= lo && x.v <= hi).sort((a, b) => a.i - b.i);
  }
  // expiry / manufacturing dates: 06/27, 06/2027, JUN-27, 0627, 30/06/2027 ...
  function parseMonthDate(text, end) {
    let t = String(text || '').trim().toUpperCase().replace(/[|\[\]{}]/g, '');
    if (!t) return '';
    const fin = (y, m, d) => { y = +y; if (y < 100) y += 2000; m = +m; if (y < 2000 || y > 2049 || m < 1 || m > 12) return ''; return mk(y, m, d || (end ? daysIn(y, m) : 1)) };
    let r = t.match(/(\d{1,2})\s?[\/\-.]\s?(\d{1,2})\s?[\/\-.]\s?(\d{4}|\d{2})/);
    if (r) { const v = mk(+r[3], +r[2], +r[1]); if (v) return v }
    r = t.match(/(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if (r) return mk(+r[1], +r[2], +r[3]);
    r = t.match(/^(20\d{2})[\/\-.](\d{1,2})$/);
    if (r) return fin(r[1], r[2]);
    r = t.match(/([A-Z]{3,9})\.?[\s\-\/.']*(\d{4}|\d{2})\b/);
    if (r && monthOf(r[1])) return fin(r[2], monthOf(r[1]));
    r = t.match(/(?<!\d)(\d{1,2})\s?[\/\-.:']\s?(\d{4}|\d{2})(?!\d)/);
    if (r) return fin(r[2], r[1]);
    const d = t.replace(/[^0-9]/g, '');
    if (/^\d{4}$/.test(t.replace(/\s/g, '')) && +d.slice(0, 2) >= 1 && +d.slice(0, 2) <= 12) return fin(d.slice(2), d.slice(0, 2));
    if (/^\d{5}$/.test(d) && /[17]/.test(d[2]) && +d.slice(0, 2) <= 12) return fin(d.slice(3), d.slice(0, 2)); // "06727" = 06/27 read badly
    if (/^\d{6}$/.test(d) && +d.slice(0, 2) <= 12 && d.slice(2, 4) === '20') return fin(d.slice(2), d.slice(0, 2)); // 062027
    return '';
  }

  /* ---------- numbers ---------- */
  function fixDigits(s) { // common OCR letter/digit mix-ups inside numbers
    return s.replace(/[Oo]/g, '0').replace(/[Il|!]/g, '1').replace(/[Ss](?=\d|$)/g, '5').replace(/[Zz]/g, '2').replace(/B(?=\d)/g, '8');
  }
  function money(tok) {
    let s = String(tok == null ? '' : tok).trim();
    if (!s) return null;
    if (typeof tok === 'number') return Number.isFinite(tok) ? { v: tok, dot: !Number.isInteger(tok) } : null;
    const neg = /^\(.*\)$/.test(s) || /^[-−–]/.test(s);
    s = s.replace(/^(?:rs|inr)\.?/i, '').replace(/[₹$\s]/g, '').replace(/\/-$/, '').replace(/^[(\-−–+]+|[)]+$/g, '').replace(/[,']/g, '');
    if (!s || digits(s) === 0) return null;
    if (letters(s) && digits(s) >= 2 && letters(s) <= 2) s = fixDigits(s);
    s = s.replace(/[.:]+$/, '');
    if (!/^\d*\.?\d+$/.test(s)) return null;
    const v = Number(s);
    return Number.isFinite(v) ? { v: neg ? -v : v, dot: s.includes('.') } : null;
  }
  const num = tok => { const m = money(tok); return m ? m.v : '' };
  const isPct = t => /%$/.test(t) || /^@/.test(t);

  /* ---------- tokens / lines ---------- */
  const NOISE = /^[|\[\]{}=~_—–:;!,.'"`*^<>\\\/]+$/;
  function cleanTok(t) {
    t = String(t).replace(/^[|\[\]{}!]+|[|\[\]{}!]+$/g, '').trim();
    return NOISE.test(t) ? '' : t;
  }
  function prepareDoc(doc) {
    const lines = [];
    for (const l of doc.lines || []) {
      const toks = [];
      for (const k of l.toks || []) {
        const parts = String(k.t).split(/\s+/).filter(Boolean);
        if (parts.length > 1 && doc.source !== 'sheet') { // split multi-word items, spread x evenly by length
          const total = parts.join(' ').length, span = (k.x1 - k.x0) / Math.max(1, total);

const uid=()=>{if(crypto.randomUUID)return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');

const USERS_KEY='rxpx-v2:users',SESSION_KEY='rxpx-v2:session',DATA_KEY=id=>'rxpx-v2:data:'+id,FLOW_KEY='rxpx-v2:flow',LEGACY_KEY='hospital-bills-preview-v1',SS_KEY='rxpx-v3:session',LAST_KEY=id=>'rxpx-v2:last:'+id;

async function pwHash(pw,salt){if(!crypto.subtle)throw new Error('Open the app over https:// to sign in securely.');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},key,256);return[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')}
// the script in the Google Sheet is the server; every request carries this account's sign-in
async function api(action,data={},ms=90000){let r;
try{r=await withTimeout(fetch(CFG.SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,session:S.session||'',...data})}),ms,'The Google Sheet did not answer in time. Try again.')}
catch(e){throw new Error(/in time/.test(e.message)?e.message:'No internet connection. Check your connection and try again.')}
let j=null;try{j=await r.json()}catch{}
if(!j)throw new Error('The Google Sheet did not answer properly. Check that its script is deployed as a web app with access "Anyone" (see SETUP.md).');
if(!j.ok){if(j.code=='session'&&S.user)setTimeout(sessionExpired);throw new Error(j.error||'Something went wrong. Try again.')}
return j}

  async signIn(email,pw){const j=await api('signin',{email,password:pw});S.session=j.session;LS.set(SS_KEY,{token:j.session,user:j.user});return j.user},

function mergeMeds(list,meds,drop=[]){const out=list.filter(m=>!drop.includes(m.id));for(const m of meds){const j=out.findIndex(x=>x.id==m.id);if(j>=0)out[j]={...m};else out.push({...m})}return out}
function mergeSave(st,p){const names=st.names.slice();let j=names.findIndex(x=>x.id==p.name.id);if(j<0)j=names.findIndex(x=>lc(x.name)==lc(p.name.name));let nm;
  if(j>=0){nm={...names[j],type:names[j].type||p.name.type||''};names[j]=nm}else{nm={id:p.name.id,name:String(p.name.name).trim(),type:p.name.type||'',created_at:new Date().toISOString()};names.push(nm)}

/* ===================== medicine stock ===================== */
const FORMS=[[/\bTABLETS?\b|\bTABS?\b/g,'TAB'],[/\bCAPSULES?\b|\bCAPS\b/g,'CAP'],[/\bINJECTIONS?\b/g,'INJ'],[/\bSYRUP\b|\bSYR\b/g,'SYP'],[/\bSUSPENSION\b/g,'SUSP'],[/\bOINTMENT\b/g,'OINT'],[/\bDROPS\b/g,'DROP']];
function medKey(n){let s=' '+String(n||'').toUpperCase().replace(/[^A-Z0-9.]+/g,' ')+' ';for(const[r,v]of FORMS)s=s.replace(r,v);return s.replace(/\b\d+\s*'?S\b|\b\d+\s*X\s*\d+\b|\bSTRIPS?\b|\bPACK\b|\b\d+(?:\.\d+)?\s*(?:ML|L|LTR)\b/g,' ').replace(/\s+/g,' ').trim()}
function sameMed(a,b){if(!a||!b)return false;if(a===b)return true;const na=(a.match(/\d+(?:\.\d+)?/g)||[]).join(','),nb=(b.match(/\d+(?:\.\d+)?/g)||[]).join(',');if(na!==nb)return false;const la=a.replace(/[^A-Z]/g,''),lb=b.replace(/[^A-Z]/g,'');if(la.length<3||lb.length<3)return false;return 1-BillParser.lev(la,lb)/Math.max(la.length,lb.length)>=0.8}
const keyOf=m=>m.key||(m.key=medKey(m.name));
const normBatch=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9\-\/]/g,'');
function packsSold(it,lots){const q=+it.quantity||0;if(!q)return 0;const lotPack=+(lots.find(l=>+l.pack_n>0)||{}).pack_n||0,pn=+it.pack_n||lotPack;if(pn===1)return q;
const m=+it.mrp||+(lots.find(l=>+l.mrp>0)||{}).mrp||0,a=+it.amount||0;
if(m&&a){const ratio=q*m/a;if(pn>1&&Math.abs(ratio-pn)/pn<=0.25)return q/pn;if(ratio>=1.5&&ratio<=100&&Math.abs(ratio-Math.round(ratio))<0.06)return q/Math.round(ratio)}
return q}
// adds (purchase) or takes away (sale) stock in `meds`; returns what moved
function applyStock(b,meds){const effect={added:0,removed:0,shortage:[],movements:[]};if(!TYPES[b.type]?.med)return effect;
const sup=b._name||nameOf(b);
for(const i of b.items){const n=String(i.description||'').trim(),k=medKey(n),bt=normBatch(i.batch_no);if(!n||!k)continue;
if(b.type=='medicine_purchase'){const units=r3((+i.quantity||0)+(+i.free||0));if(units<=0)continue;let m=meds.find(x=>sameMed(keyOf(x),k)&&normBatch(x.batch)==bt);
if(m){m.qty=r3((+m.qty||0)+units);m.expiry=okDate(i.expiry_date)?i.expiry_date:m.expiry;m.manufacture_date=okDate(i.manufacture_date)?i.manufacture_date:m.manufacture_date;m.supplier=sup||m.supplier;if(+i.pack_n)m.pack_n=+i.pack_n;if(+i.mrp)m.mrp=+i.mrp;if(+i.rate)m.rate=+i.rate}
else{m={id:uid(),name:n,key:k,batch:bt,qty:units,pack_n:+i.pack_n||'',mrp:+i.mrp||'',rate:+i.rate||'',manufacture_date:okDate(i.manufacture_date)?i.manufacture_date:'',expiry:okDate(i.expiry_date)?i.expiry_date:'',supplier:sup};meds.push(m)}
effect.added=r3(effect.added+units);effect.movements.push({direction:'in',lot:m.id,name:m.name,batch:m.batch,quantity:units,manufacture_date:m.manufacture_date,expiry:m.expiry})}
else{const lots=meds.filter(x=>sameMed(keyOf(x),k)),rank=x=>{const xb=normBatch(x.batch);return !bt||!xb?2:xb==bt?0:BillParser.lev(xb,bt)<=1?1:2},avail=lots.filter(x=>(+x.qty||0)>0).sort((x,y)=>rank(x)-rank(y)||byExp(x,y));
let left=r3(packsSold(i,lots));if(left<=0)continue;
for(const m of avail){if(left<=0)break;const moved=r3(Math.min(+m.qty,left));if(moved<=0)continue;m.qty=r3(m.qty-moved);left=r3(left-moved);effect.removed=r3(effect.removed+moved);effect.movements.push({direction:'out',lot:m.id,name:m.name,batch:m.batch,quantity:moved,manufacture_date:m.manufacture_date||'',expiry:m.expiry||''})}
if(left>0.0005)effect.shortage.push({name:n,quantity:left})}}
return effect}
// undoes a saved bill's stock movements in `meds`; returns a message when that is not safe.
// strict=false (editing): the edited bill is applied right after, and only the final stock has to stay at or above zero
function reverseStock(b,meds,strict=true){if(!TYPES[b.type]?.med)return'';if(!Array.isArray(b.stock_movements))return'This bill has no saved stock history, so it cannot be changed safely.';
for(const m of b.stock_movements){const lot=meds.find(x=>x.id&&x.id===m.lot)||meds.find(x=>sameMed(keyOf(x),medKey(m.name))&&normBatch(x.batch)==normBatch(m.batch));
if(m.direction=='in'){if(!lot){if(strict)return`Cannot take back ${m.quantity} of ${m.name}: that stock is no longer listed.`;continue}if(strict&&(+lot.qty||0)<m.quantity-0.0005)return`Cannot take back ${m.quantity} of ${m.name}: some of that stock has already been sold. Delete or change that sale bill first.`;lot.qty=r3((+lot.qty||0)-m.quantity)}
else if(m.direction=='out'){if(lot)lot.qty=r3((+lot.qty||0)+m.quantity);else meds.push({id:uid(),name:m.name,key:medKey(m.name),batch:m.batch||'',qty:m.quantity,pack_n:'',mrp:'',rate:'',manufacture_date:m.manufacture_date||'',expiry:m.expiry||'',supplier:''})}}return''}
const changedMeds=(meds,drop=[])=>meds.filter(m=>!drop.includes(m.id)&&JSON.stringify(S.meds.find(x=>x.id==m.id))!==JSON.stringify(m));

const emptyLots=(old,meds,keep=[])=>[...new Set((old.stock_movements||[]).filter(m=>m.direction=='in').map(m=>m.lot))].filter(id=>{const lot=meds.find(x=>x.id==id);return lot&&Math.abs(+lot.qty||0)<0.0005&&!keep.some(m=>m.lot==id)&&!S.bills.some(o=>o.id!=old.id&&(o.stock_movements||[]).some(m=>m.lot==id))});

function fileKind(file){const name=file.name.toLowerCase();if(file.type.startsWith('image/')||/\.(jpe?g|png|webp|bmp|gif|heic|heif)$/.test(name))return'image';if(file.type=='application/pdf'||name.endsWith('.pdf'))return'pdf';if(/\.(xlsx|xls|csv)$/.test(name)||/spreadsheet|excel|text\/csv/.test(file.type))return'sheet';return''}
const loadImageEl=file=>new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res({img:i,done:()=>URL.revokeObjectURL(u)});i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('This photo cannot be opened. Choose a JPG or PNG photo.'))};i.src=u});
const parseCtx=()=>({hospitalKey:CFG.HOSPITAL_KEY,prior:usualType(S.flowName)});
async function hashPages(pages){try{if(!crypto.subtle)return'';const parts=[];for(const p of pages)parts.push(new Uint8Array(await crypto.subtle.digest('SHA-256',await p.file.arrayBuffer())));let h=parts[0];if(parts.length>1){const all=new Uint8Array(parts.length*32);parts.forEach((x,i)=>all.set(x,i*32));h=new Uint8Array(await crypto.subtle.digest('SHA-256',all))}return[...h].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return''}}

/* AI reader (Claude, called by the Google Sheet's script): the accurate path */
const monthDate=(v,end)=>{const s=String(v||'').trim();return !s?'':okDate(s)?s:BillParser.parseMonthDate(s,end)};
function fromAI(a){if(!a||a.is_bill===false)throw new Error('This does not look like a bill. Take a photo of the whole bill and try again.');
const type=TYPES[a.bill_type]?a.bill_type:'',out=OUT_T.includes(type);
const items=(a.items||[]).map(i=>{const desc=String(i.description||'').replace(/\s+/g,' ').trim(),pack=String(i.pack||'').trim();return{description:desc,batch_no:normBatch(i.batch_no),pack,manufacture_date:monthDate(i.manufacture_date,false),expiry_date:monthDate(i.expiry_date,true),quantity:num(i.quantity),free:num(i.free_quantity),mrp:num(i.mrp),rate:num(i.rate),disc:num(i.discount_percent),gst:num(i.gst_percent),amount:num(i.amount),pack_n:BillParser.packSize(pack)||BillParser.packSize(desc)||(BillParser.SINGLE.test(desc)?1:''),unclear:!!i.unclear}}).filter(i=>i.description);
let date=String(a.bill_date||'').trim();if(!okDate(date))date=(BillParser.findDates(date)[0]||{}).v||'';
const d={bill_number:String(a.bill_number||'').trim(),bill_date:date,payment_mode:String(a.payment_mode||'').trim(),total_amount:num(a.total_amount),tax_amount:num(a.tax_amount),discount_amount:num(a.discount_amount),subtotal:num(a.subtotal),
seller:String((out?a.seller_name:(a.patient_name||a.buyer_name))||'').trim(),party_ref:String((out?a.seller_gstin:a.patient_id)||'').trim(),type,type_sure:!!a.type_certain&&!!type,items,unclear:(a.unclear_fields||[]).map(String),warnings:[],text:JSON.stringify(a)};
if(d.total_amount===''&&items.length){const s=r2(items.reduce((t,i)=>t+(+i.amount||0),0));if(s>0){d.total_amount=r2(s+(+d.tax_amount||0)-Math.abs(+d.discount_amount||0));d.warnings.push('total_calculated')}}
return d}
async function aiRead(up,id){const pages=[];
if(up.kind=='image'){for(const[i,p]of up.pages.entries()){setReadProgress(up.pages.length>1?`Preparing page ${i+1} of ${up.pages.length}...`:'Preparing the photo...',0);const{img,done}=await loadImageEl(p.file);try{pages.push({media_type:'image/jpeg',data:await b64(await BillImage.jpeg(img,p.rot||0,2576,0.88))})}finally{done()}}}
else{const f=up.pages[0].file;if(f.size>18*1024*1024)throw new Error('This PDF is too large for the AI reader.');pages.push({media_type:'application/pdf',data:await b64(f)})}
if(S.run!=id)throw new Error('cancelled');
setReadProgress('Reading every line of the bill. This usually takes 20 to 60 seconds...',1);
const j=await api('read',{pages,hospital_name:CFG.HOSPITAL_NAME,bill_name:S.flowName,usual_type:usualType(S.flowName)},340000);
if(!j.bill)throw new Error('The AI reader returned nothing.');
const d=fromAI(j.bill);d.read={source:'ai'};return d}

/* basic reader (in the browser, works offline): Tesseract OCR + BillParser */
const READ={ready:null,worker:null,log:null};
function ocrReady(){if(!window.Tesseract)return Promise.reject(new Error('The bill reader could not load. Check your internet connection and try again.'));
if(!READ.ready){READ.ready=(async()=>{const w=await Tesseract.createWorker('eng',1,{logger:m=>READ.log&&READ.log(m)});await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1',user_defined_dpi:'300'});READ.worker=w;return w})();READ.ready.catch(()=>{READ.ready=null})}return READ.ready}
const resetReader=()=>{try{READ.worker&&READ.worker.terminate()}catch{}READ.worker=null;READ.ready=null};
const warmReader=()=>{if(ONLINE&&S.server?.ai!==false)return;try{ocrReady().catch(()=>{})}catch{}};
async function ocrCanvas(canvas,label){
READ.log=m=>{if(m.status=='recognizing text')setReadProgress(`${label} ${Math.round((m.progress||0)*100)}%`,1);else if(/loading|initializ/.test(m.status||''))setReadProgress('Getting the bill reader ready. The first time can take a minute...',1)};
const w=await withTimeout(ocrReady(),150000,'The bill reader took too long to load. Check your internet connection and try again.',resetReader);
const r=await withTimeout(w.recognize(canvas),150000,'Reading took too long. Try a clearer photo taken closer to the bill.',resetReader);
return{conf:r.data.confidence||0,lines:(r.data.lines||[]).map(l=>({toks:(l.words||[]).map(wd=>({t:wd.text,x0:wd.bbox.x0,x1:wd.bbox.x1,y0:wd.bbox.y0,y1:wd.bbox.y1,c:wd.confidence}))}))}}
async function ocrImages(up,id){const all=[];let conf=0;
for(const[pi,p]of up.pages.entries()){const pre=up.pages.length>1?`Page ${pi+1}: `:'';const{img,done}=await loadImageEl(p.file);try{setReadProgress(pre+'Cleaning up the photo...',1);await sleep(30);
let best=null;const rot=p.rot||0,side=(rot%2==0)&&BillImage.sideways(img),order=side?[1,3,0]:[0,1,3,2];
for(const extra of order){if(S.run!=id)throw new Error('cancelled');const r=await ocrCanvas(BillImage.prepare(img,rot+extra),pre+(extra?'Turning the photo and reading again...':'Reading...'));const d=BillParser.parse({source:'ocr',lines:r.lines},parseCtx());const real=d.total_amount!==''&&!d.warnings.includes('total_calculated');const score=d.items.length*2+(real?4:0)+(d.bill_date?2:0)+(d.bill_number?2:0)+r.conf/10;if(!best||score>best.score)best={score,r,rot:rot+extra};if(d.items.length&&real&&(d.bill_date||d.bill_number)||r.conf>=70&&(d.bill_date||d.bill_number||d.items.length))break}
p.rot=((best.rot%4)+4)%4;all.push(...best.r.lines);conf+=best.r.conf}finally{done()}}
const d=BillParser.parse({source:'ocr',lines:all},parseCtx());d.read={source:'basic',conf:Math.round(conf/up.pages.length)};return d}
function groupLines(toks){toks.sort((a,b)=>a.y0-b.y0||a.x0-b.x0);const lines=[];for(const t of toks){const h=Math.max(1,t.y1-t.y0),cy=(t.y0+t.y1)/2,l=lines.find(l=>Math.abs(l.cy-cy)<=Math.max(h,l.h)*0.5);if(l){l.toks.push(t)}else lines.push({cy,h,toks:[t]})}lines.sort((a,b)=>a.cy-b.cy);return lines.map(l=>({toks:l.toks.sort((a,b)=>a.x0-b.x0)}))}
async function readPdf(file,id){if(!window.pdfjsLib)throw new Error('PDF reading is unavailable. Check your internet connection or upload photos of the pages instead.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const pdf=await withTimeout(pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,30000,'Could not open this PDF in time. Try another copy.');if(pdf.numPages>30)throw new Error('This PDF has more than 30 pages. Split it into smaller files and try again.');
